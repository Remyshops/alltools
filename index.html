 class=\"field-label\" style=\"margin-top:18px;\">پیش‌نمایش پرامپت — قبل از رفتن به ChatGPT می‌تونی ویرایشش کنی<\/label>\n      <textarea id=\"promptOut\" rows=\"10\"><\/textarea>\n      <div class=\"actions\">\n        <button class=\"btn btn-ghost\" id=\"copyBtn\">کپی پرامپت<\/button>\n        <button class=\"btn btn-primary\" id=\"goBtn\">رفتن به ChatGPT ↗<\/button>\n      <\/div>\n      <div class=\"copied-msg\" id=\"copiedMsg\">کپی شد ✓<\/div>\n    <\/div>\n  <\/div>\n\n<\/div>\n\n<script>\nconst days = [\n  { key:'d1', name:'روز ۱', sub:'دوشنبه',\n    techniques:['معرفی مدرس و سوابق کاری مدرس','اعتمادسازی','نیازسازی مخاطب','پرسیدن سوال تعاملی از مخاطب'],\n    techniquesStore:['معرفی فروشگاه و اعتبار برند','اعتمادسازی','نیازسازی مخاطب','پرسیدن سوال تعاملی از مخاطب']\n  },\n  { key:'d2', name:'روز ۲', sub:'سه‌شنبه',\n    techniques:['نیازسازی','اعتمادسازی','متقاعدسازی مخاطب','دادن دلیل و چرایی','تکنیک ترساندن مخاطب','گفتن مزایای دوره'],\n    techniquesStore:['نیازسازی','اعتمادسازی','متقاعدسازی مخاطب','دادن دلیل و چرایی','تکنیک ترساندن مخاطب (ریسک نداشتن محصول)','گفتن مزایای محصول']\n  },\n  { key:'d3', name:'روز ۳', sub:'چهارشنبه',\n    techniques:['نیازسازی','اعتمادسازی','دلیل و چرایی','متقاعدسازی مخاطب','تکنیک بعداً دیر میشه','تکنیک اولویت‌بندی','مزایای دوره'],\n    techniquesStore:['نیازسازی','اعتمادسازی','دلیل و چرایی','متقاعدسازی مخاطب','تکنیک بعداً دیر میشه','تکنیک اولویت‌بندی','مزایای محصول']\n  },\n  { key:'d4', name:'روز ۴', sub:'پنجشنبه',\n    techniques:['نیازسازی','اعتمادسازی','دلیل و چرایی','چالش باور و رفع موانع ذهنی','مانور روی فرصت و اهمیتش','خبر ویدیوی رایگان فردا'],\n    techniquesStore:['نیازسازی','اعتمادسازی','دلیل و چرایی','چالش باور و رفع موانع ذهنی مشتری','مانور روی فرصت و اهمیتش','خبر نمایش نحوه استفاده از محصول فردا']\n  },\n  { key:'d5', name:'روز ۵', sub:'جمعه',\n    techniques:['مرور دردهای مخاطب','پاسخ به سوالات در پیوی','معرفی دوره','مانور روی فرصت','سوال تعاملی','ایجاد هیجان و صف خرید','تکنیک تلنگر زدن','معرفی ویدیوی اول مدرس','تکنیک محدودیت و ظرفیت محدود'],\n    techniquesStore:['مرور دردهای مخاطب','پاسخ به سوالات در دایرکت','معرفی محصول','مانور روی فرصت','سوال تعاملی','ایجاد هیجان و صف خرید','تکنیک تلنگر زدن','نمایش ویدیوی اول از نحوه استفاده محصول','تکنیک محدودیت و موجودی محدود']\n  },\n  { key:'d6', name:'روز ۶', sub:'شنبه',\n    techniques:['ایجاد هیجان و صف خرید','پاسخ به سوالات و رفع ابهام','مرور درد و نشان‌دادن لذت بعد از دوره','اهمیت مهارت پولساز و مانور روی فرصت','معرفی ویدیوی دوم مدرس'],\n    techniquesStore:['ایجاد هیجان و صف خرید','پاسخ به سوالات و رفع ابهام','مرور درد و نشان‌دادن راحتی بعد از خرید محصول','اهمیت کیفیت و کاربرد محصول و مانور روی فرصت','نمایش ویدیوی دوم از کاربرد محصول']\n  },\n  { key:'d7', name:'روز ۷', sub:'یکشنبه',\n    techniques:['ایجاد هیجان','تکنیک ترساندن مخاطب','تکنیک آینده ایده‌آل و تصویرسازی','متقاعدسازی مخاطب','گذاشتن رضایت‌های دوره','پاسخ به سوالات','معرفی ویدیوی سوم مدرس','ایجاد صف خرید در پیوی','مقایسه قبل و بعد'],\n    techniquesStore:['ایجاد هیجان','تکنیک ترساندن مخاطب (از دست دادن فرصت)','تکنیک آینده ایده‌آل بعد از استفاده از محصول','متقاعدسازی مخاطب','گذاشتن رضایت مشتریان قبلی','پاسخ به سوالات','نمایش ویدیوی سوم از محصول','ایجاد صف خرید در دایرکت','مقایسه قبل و بعد از استفاده از محصول']\n  },\n  { key:'d8', name:'روز ۸', sub:'دوشنبه',\n    techniques:['ایجاد هیجان بالا','متقاعدسازی نهایی','تکنیک مقایسه و انتخاب','اعلام قیمت و شماره کارت','نمایش واریزی‌ها و ایجاد صف خرید','چرا این مدرس، چرا الان، چرا این حوزه'],\n    techniquesStore:['ایجاد هیجان بالا','متقاعدسازی نهایی','تکنیک مقایسه و انتخاب','اعلام قیمت و شماره کارت فروشگاه','نمایش سفارش‌ها و واریزی‌ها و ایجاد صف خرید','چرا این فروشگاه، چرا الان، چرا این محصول']\n  }\n];\n\nconst platforms = ['اینستاگرام','تلگرام','ایتا','روبیکا','بله','باسلام','همه پلتفرم‌ها'];\n\n// پیشنهاد اقدام مناسب برای CTA، متناسب با امکانات واقعی هر پلتفرم\nconst ctaSuggestionByPlatform = {\n  'اینستاگرام': 'کامنت گذاشتن، دایرکت دادن، یا لینک بیو',\n  'تلگرام': 'پیام دادن به آیدی یا ادمین، عضویت در کانال/گروه، یا کلیک روی لینک',\n  'ایتا': 'پیام دادن به آیدی یا ادمین، عضویت در کانال، یا کلیک روی لینک (نه کامنت گذاشتن، چون ایتا کامنت زیر پست نداره)',\n  'روبیکا': 'پیام دادن به آیدی یا ادمین، عضویت در کانال، یا کلیک روی لینک',\n  'بله': 'پیام دادن به آیدی یا ادمین، عضویت در کانال، یا کلیک روی لینک',\n  'باسلام': 'پیام دادن در چت باسلام یا ثبت سفارش داخل خود باسلام',\n  'همه پلتفرم‌ها': 'اقدامی که واقعاً تو همون پلتفرم امکان‌پذیره (مثلاً تو اینستاگرام کامنت/دایرکت، ولی تو پیام‌رسان‌هایی مثل تلگرام/ایتا/روبیکا/بله پیام دادن به آیدی یا عضویت در کانال، نه کامنت گذاشتن)'\n};\nfunction getCtaSuggestion(){\n  return ctaSuggestionByPlatform[selectedPlatform] || 'اقدامی که واقعاً تو همون پلتفرم امکان‌پذیره';\n}\n\n// campaign type: educational course vs store/product\nconst campaignTypes = [\n  { key:'course', label:'دوره آموزشی', noun:'دوره آموزشی', imageNoun:'عکس دوره یا مدرس' },\n  { key:'store', label:'فروشگاهی (محصول)', noun:'فروشگاه اینترنتی', imageNoun:'عکس محصول' }\n];\nlet selectedCampaignType = campaignTypes[0];\n\nconst campaignTypeRow = document.getElementById('campaignTypeRow');\ncampaignTypes.forEach((c,i)=>{\n  const el = document.createElement('div');\n  el.className = 'day-card' + (i===0?' sel':'');\n  el.textContent = c.label;\n  el.addEventListener('click', ()=>{\n    selectedCampaignType = c;\n    document.querySelectorAll('#campaignTypeRow .day-card').forEach(x=>x.classList.remove('sel'));\n    el.classList.add('sel');\n    document.getElementById('storyImgLabel').textContent =\n      `${c.imageNoun} (اختیاری) — اگه نداری خالی بذار، ChatGPT بدون عکس هم برات طرح استوری می‌سازه`;\n    if(selectedDay) renderTechPreview(selectedDay);\n  });\n  campaignTypeRow.appendChild(el);\n});\n\nfunction getTechniques(d){\n  return selectedCampaignType.key === 'store' ? d.techniquesStore : d.techniques;\n}\n\nlet selectedTechIndexes = new Set();\n\nfunction getSelectedTechniques(d){\n  return getTechniques(d).filter((t,i)=> selectedTechIndexes.has(i));\n}\n\nlet selectedDay = null;\nlet selectedPlatform = 'اینستاگرام';\nlet selectedTone = 'friendly';\n\n// render day grid\nconst dayGrid = document.getElementById('dayGrid');\ndays.forEach(d=>{\n  const el = document.createElement('div');\n  el.className = 'day-card';\n  el.innerHTML = `${d.name}<small>${d.sub}<\/small>`;\n  el.addEventListener('click', ()=>{\n    selectedDay = d;\n    document.querySelectorAll('.day-card').forEach(c=>c.classList.remove('sel'));\n    el.classList.add('sel');\n    renderTechPreview(d);\n  });\n  dayGrid.appendChild(el);\n});\n// default select day 1\ndayGrid.children[0].click();\n\nfunction renderTechPreview(d){\n  const box = document.getElementById('techPreview');\n  box.innerHTML = '';\n  const techs = getTechniques(d);\n  selectedTechIndexes = new Set(techs.map((t,i)=>i)); // همه پیش‌فرض انتخاب شده\n  techs.forEach((t,i)=>{\n    const c = document.createElement('span');\n    c.className = 'chip sel';\n    c.textContent = t;\n    c.addEventListener('click', ()=>{\n      if(selectedTechIndexes.has(i)){\n        selectedTechIndexes.delete(i);\n        c.classList.remove('sel');\n      } else {\n        selectedTechIndexes.add(i);\n        c.classList.add('sel');\n      }\n    });\n    box.appendChild(c);\n  });\n}\n\n// platform row\nconst platformRow = document.getElementById('platformRow');\nplatforms.forEach((p,i)=>{\n  const el = document.createElement('div');\n  el.className = 'day-card' + (i===0?' sel':'');\n  el.textContent = p;\n  el.addEventListener('click', ()=>{\n    selectedPlatform = p;\n    document.querySelectorAll('#platformRow .day-card').forEach(c=>c.classList.remove('sel'));\n    el.classList.add('sel');\n    updateBasalamWarning();\n    updateOutputTypeLabels();\n  });\n  platformRow.appendChild(el);\n});\n\nfunction updateBasalamWarning(){\n  const isBasalamStory = (selectedPlatform === 'باسلام' && selectedOutputType === 'story');\n  document.getElementById('basalamWarning').style.display = isBasalamStory ? 'block' : 'none';\n}\n\n// count slider\nconst countRange = document.getElementById('countRange');\nconst countBox = document.getElementById('countBox');\nconst faDigits = n => String(n).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);\ncountRange.addEventListener('input', ()=>{ countBox.textContent = faDigits(countRange.value); });\ncountBox.textContent = faDigits(countRange.value);\n\n// output type: caption post vs instagram story vs voice/video script\nconst outputTypes = [\n  { key:'post', label:'پست نوشتاری (کپشن)', labelBasalam:'کپشن محصول باسلام' },\n  { key:'story', label:'استوری اینستاگرام (تصویری)', labelBasalam:'استوری‌ساز باسلام' }\n];\nlet selectedOutputType = 'post';\nlet hasProductImage = false;\n\nconst outputTypeEls = {};\nconst outputTypeRow = document.getElementById('outputTypeRow');\noutputTypes.forEach((o,i)=>{\n  const el = document.createElement('div');\n  el.className = 'day-card' + (i===0?' sel':'');\n  el.textContent = o.label;\n  el.addEventListener('click', ()=>{\n    selectedOutputType = o.key;\n    document.querySelectorAll('#outputTypeRow .day-card').forEach(c=>c.classList.remove('sel'));\n    el.classList.add('sel');\n    document.getElementById('storyBox').style.display = (o.key==='story') ? 'block' : 'none';\n    updateBasalamWarning();\n  });\n  outputTypeRow.appendChild(el);\n  outputTypeEls[o.key] = el;\n});\nupdateOutputTypeLabels();\n\nfunction updateOutputTypeLabels(){\n  const isBasalam = (selectedPlatform === 'باسلام');\n  outputTypes.forEach(o=>{\n    outputTypeEls[o.key].textContent = isBasalam ? o.labelBasalam : o.label;\n  });\n}\n\n// image upload preview (local only — never sent anywhere)\ndocument.getElementById('imgInput').addEventListener('change', (e)=>{\n  const file = e.target.files[0];\n  const wrap = document.getElementById('imgPreviewWrap');\n  if(!file){ hasProductImage = false; wrap.style.display = 'none'; return; }\n  hasProductImage = true;\n  const reader = new FileReader();\n  reader.onload = ev => { document.getElementById('imgPreview').src = ev.target.result; };\n  reader.readAsDataURL(file);\n  wrap.style.display = 'flex';\n});\n\n// کتابخانه تکنیک‌های فروش و متقاعدسازی — به تشخیص خودِ ChatGPT هرجا لازم بود استفاده می‌شه\nconst persuasionTechniques = [\n  'برچسب زدن: به مخاطب هویتی نسبت بده که خودش رو توش ببینه',\n  'آینده ایده‌آل و تصویرسازی: مخاطب رو به تصور آینده مطلوب ببر',\n  'تکنیک شوهرعمه: یک باور عامیانه رو مطرح کن و نشون بده داستان پیچیده‌تره',\n  'چالش باور: یکی از باورهای فعلی مخاطب رو زیر سوال ببر',\n  'ترسیم نتیجه فعلی: نشون بده ادامه وضعیت فعلی چه نتیجه‌ای داره',\n  'اولویت‌بندی مشکلات: بگو همه مشکلات ارزش یکسان ندارن، مهم‌ترین رو اول نشون بده',\n  'اثر گروهی: نشون بده افراد مشابه مخاطب چطور رفتار کردن (فقط با داده یا تجربه واقعی)',\n  'اعتماد و خیانت: تضاد بین یک باور رایج و نتیجه واقعی‌ای که ساخته رو نشون بده',\n  'انتخاب غلط: هزینه یک انتخاب نادرست رو نشون بده',\n  'اثر خط پایان: پایان یک فرصت واقعی رو برجسته کن (بدون مهلت ساختگی)',\n  'یه راز مهم که نمی‌دونی: یک شکاف اطلاعاتی واقعی ایجاد کن',\n  'به‌زودی دیر میشه: هزینه تاخیر در تصمیم‌گیری رو نشون بده',\n  'مشکل بدون راه‌حل → محصول ناجی: مشکل رو معرفی کن، بگو روش قبلی چرا جواب نداده، بعد محصول رو راه‌حل معرفی کن',\n  'ای کاش زودتر می‌دونستم: از حس حسرت استفاده کن',\n  'داری می‌بازی (نسخه ملایم): نشون بده تعلل چه هزینه‌ای داره',\n  'راه رو اشتباه رفتی: نشون بده مشکل شاید مسیر غلط باشه نه کم‌کاری',\n  'من گفتم تو باور نکردی: ساختار هشدار → بی‌توجهی → نتیجه',\n  'یادته وقتی...: مخاطب رو به یه خاطره مرتبط برگردون',\n  'تو همونی ولی نسخه ضعیف‌ترش: فاصله بین وضعیت فعلی و نسخه بهتر خودش رو نشون بده',\n  'قانون ۱۰ برابر: سوال رو بزرگ‌تر از یه بهبود جزئی مطرح کن',\n  'تو انتخاب نکردی، برات انتخاب شده: نشون بده تصمیم فعلی حاصل عادت یا محیط بوده',\n  'بازی با پشیمانی آینده: مخاطب رو به یه نقطه در آینده ببر و پشیمونی احتمالی رو نشون بده',\n  'مالکیت: نتیجه رو مثل چیزی که همین الان مال مخاطبه توصیف کن',\n  'کاهش خودسرزنشگری: نشون بده نگرفتن نتیجه لزوماً تقصیر خودش نبوده',\n  'تحریک عاطفی + دلیل منطقی: احساس قوی ایجاد کن و بعدش دلیل منطقی بیار',\n  'همدردی: قبل از فروش نشون بده شرایط مخاطب رو درک می‌کنی',\n  'مقایسه: وضعیت با و بدون محصول رو کنار هم بذار',\n  'فروش با احساسات: به‌جای ویژگی، روی احساسِ نتیجه تمرکز کن',\n  'شناسایی ترس‌های مخاطب و پاسخ به هرکدوم: ترس‌های رایج خرید رو پیدا کن و جواب واقعی بده',\n  'فروش با داستان: قبل → مشکل → تلاش اشتباه → نقطه تغییر → راه‌حل → نتیجه',\n  'مقصد و مسیر: نتیجه بزرگ رو با نشون دادن مراحل رسیدن بهش قابل دستیابی کن',\n  'اولویت‌بندی تصمیم خرید: بگو اگه فقط یک کار رو انجام بده، همین یکی رو انجام بده',\n  'نگو، نشونم بده: به‌جای ادعا، مدرک و نمونه واقعی نشون بده',\n  'محرک اصلی مخاطب: بر اساس نوع مخاطب، محرک غالب (سود/ترس/راحتی/تعلق/امنیت/کنجکاوی) رو تقویت کن',\n  'محرک ترس (بدون ترساندن دروغین): ترس واقعی از ضرر رو به‌آرومی نشون بده',\n  'احساس + منطق با هم: میل احساسی رو با یه دلیل منطقی تکمیل کن',\n  'استراتژی اُمگا: مقاومت مخاطب رو پیدا کن، حلش کن، ارزش رو ثابت کن، اقدام رو آسون کن',\n  'تهاجمی (بدون توهین): پیام مستقیم و قاطع، بدون حاشیه',\n  'معکوس کردن: به‌جای «چرا بخری»، بپرس «چه زمانی خریدش منطقی نیست»',\n  'رفع بهانه‌های رایج + کاهش ریسک: بهانه‌های متداول رو جواب بده و در صورت امکان ضمانت/نمونه/شفافیت ارائه کن'\n];\n\nfunction persuasionBlock(){\n  let t = `\\nعلاوه بر تکنیک‌های خود روز، این کتابخانه تکنیک‌های فروش و متقاعدسازی هم در اختیارته؛ خودت با توجه به محتوا و هدف هر خروجی تشخیص بده کجا و کدوم‌هاشون واقعاً کمک می‌کنه (نیازی نیست همه رو یا حتماً همیشه استفاده کنی، فقط جایی که به پیام قدرت واقعی می‌ده):\\n`;\n  persuasionTechniques.forEach(t2=> t += `- ${t2}\\n`);\n  return t;\n}\n\n\n// tone selector\ndocument.querySelectorAll('#toneRow .day-card').forEach(el=>{\n  el.addEventListener('click', ()=>{\n    selectedTone = el.dataset.tone;\n    document.querySelectorAll('#toneRow .day-card').forEach(x=>x.classList.remove('sel'));\n    el.classList.add('sel');\n  });\n});\n\nfunction toneInstruction(){\n  return selectedTone === 'formal'\n    ? 'لحن کاملاً رسمی و حرفه‌ای باشد؛ محترمانه، دقیق و روان، بدون اصطلاحات خیلی محاوره‌ای.'\n    : 'لحن دوستانه و صمیمی باشد؛ طبیعی، گرم، محاوره‌ای و مثل گفت‌وگوی یک آدم واقعی با مخاطب.';\n}\n\n// build prompt\nfunction buildPrompt(){\n  const d = selectedDay;\n  const count = countRange.value;\n  const desc = document.getElementById('descBox').value.trim();\n  const ctaOn = document.getElementById('ctaToggle').checked;\n  const curiosityOn = document.getElementById('curiosityToggle').checked;\n  const voiceVideoOn = document.getElementById('voiceVideoSuggestToggle').checked;\n\n  if(selectedOutputType === 'story' && selectedPlatform === 'باسلام'){\n    let p = `من در باسلام یک فروشگاه دارم و می‌خوام برای محصولم استوری بسازم.\\n\\n`;\n    p += `⚠️ نکته بسیار مهم و حساس (باید صد‌درصد رعایت بشه): طبق قوانین باسلام، هرگونه تماس مستقیم بین فروشنده و خریدار خارج از خود پلتفرم ممنوعه. پس به هیچ عنوان، حتی به‌صورت ناخواسته یا داخل یک گوشه کوچیک تصویر، نباید هیچ شماره تماس، آیدی یا لینک شبکه‌های اجتماعی (اینستاگرام، تلگرام، واتساپ، ایتا، روبیکا، بله و ...)، آدرس سایت، یا هر راه ارتباطی دیگه در استوری وجود داشته باشه. این قانون absolute هست.\\n\\n`;\n    p += `لطفاً ${count} طرح استوری عمودی (سایز ۱۰۸۰×۱۹۲۰) برای معرفی محصول طراحی کن که هر کدوم زاویه یا چیدمان بصری متفاوتی داشته باشن (بدون تکرار) و همگی این قوانین رو رعایت کنن:\\n`;\n    p += `- محور اصلی و تنها عنصر تصویری استوری، همون عکس محصولیه که ضمیمه می‌کنم؛ هیچ عکس یا عنصر گرافیکی دیگه‌ای اضافه نشه.\\n`;\n    p += `- دور عکس محصول یک کادر (frame) بسیار زیبا، شیک و باکیفیت طراحی بشه (مثلاً کادر مینیمال طلایی، کادر رنگی متناسب با تم محصول، کادر با گوشه‌های گرد، یا هر استایل شیک دیگه)، طوری که استوری حس حرفه‌ای و لوکس بده.\\n`;\n    p += `- در صورت لزوم فقط می‌تونه یک متن بسیار کوتاه (مثل نام محصول یا یک جمله توصیفی/تبلیغاتی کوتاه، یا قیمت) روی طرح باشه؛ به‌جز این، مطلقاً هیچ متن یا نماد دیگه‌ای (به‌خصوص هرگونه راه ارتباطی) نباید در طرح باشه.\\n`;\n    p += `- طراحی باید تمیز، مینیمال و بصری جذاب باشه، طوری که تمرکز کامل روی خود عکس محصول و کادر دور اون باشه.\\n`;\n\n    if(hasProductImage){\n      p += `\\nمن یک ${selectedCampaignType.imageNoun} ضمیمه می‌کنم؛ طرح کادر و چیدمان هر استوری رو دقیقاً بر اساس همین عکس بچین (بدون تغییر یا جایگزینی خود عکس).\\n`;\n    } else {\n      p += `\\nهنوز عکس محصول رو ضمیمه نکردم. لطفاً برای هر طرح فقط توضیح بده که کادر و چیدمان چطور باید باشه تا بعداً عکس محصول رو داخلش بذارم؛ خودت عکس محصول نساز و جایگزین نکن.\\n`;\n    }\n\n    if(desc){\n      p += `\\nاطلاعات تکمیلی برای شخصی‌سازی استوری‌ها:\\n${desc}\\n`;\n    }\n\n    p += `\\nحالا ${count} طرح استوری رو دقیقاً بر اساس همه موارد بالا بساز؛ دوباره تأکید می‌کنم: هیچ شماره تماس، آیدی یا لینک شبکه اجتماعی، یا هر راه ارتباطی دیگه نباید در هیچ‌کدوم از طرح‌ها باشه — فقط عکس محصول با یک کادر بسیار زیبا.`;\n    return p;\n  }\n\n  if(selectedOutputType === 'story'){\n    let p = `من دارم یک کمپین فروش ۸ روزه برای یک ${selectedCampaignType.noun} اجرا می‌کنم و الان روی محتوای «${d.name}» برای استوری اینستاگرام کار می‌کنم. (این یک توضیح داخلیه فقط برای خودت؛ عبارت‌هایی مثل «کمپین فروش» یا «روز ۱» نباید به‌عنوان متن روی خود تصویر استوری نوشته بشن — متن روی تصویر باید فقط همون کپشن/هوک تبلیغاتی باشه.)\\n\\n`;\n    p += `لطفاً ${count} طرح استوری اینستاگرام (سایز عمودی ۱۰۸۰×۱۹۲۰) طراحی کن که هر کدوم بر اساس تکنیک‌های زیر باشن (هر استوری یه زاویه و قلاب متفاوت داشته باشه، بدون تکرار):\\n`;\n    (getSelectedTechniques(d).length ? getSelectedTechniques(d) : getTechniques(d)).forEach(t=> p += `- ${t}\\n`);\n\n    if(hasProductImage){\n      p += `\\nمن یک ${selectedCampaignType.imageNoun} ضمیمه می‌کنم. لطفاً طرح استوری‌ها رو بر اساس همین عکس (به‌عنوان بک‌گراند یا عنصر اصلی) بچین.\\n`;\n    } else {\n      p += `\\n${selectedCampaignType.imageNoun} ندارم؛ استوری‌ها رو فقط با رنگ پس‌زمینه، تایپوگرافی بزرگ و عناصر گرافیکی ساده طراحی کن، بدون نیاز به عکس واقعی. اگه امکانش هست خودت هم یک تصویر پس‌زمینه مناسب برای هرکدوم بساز.\\n`;\n    }\n\n    p += persuasionBlock();\n    p += `\\nقوانین طراحی استوری‌ها:\\n`;\n    p += `- متن اول (هوک) هر استوری باید خیلی قوی و جذاب باشه، طوری که مخاطب رو نگه داره و استوری بعدی رو هم ببینه.\\n`;\n    p += `- محتوای استوری کوتاه و جذاب باشه، طوری که مخاطب حس نکنه داره یه تبلیغ خشک می‌بینه.\\n`;\n    if(curiosityOn){\n      p += `- آخرین اشاره یا متن استوری یه حس کنجکاوی ایجاد کنه که مخاطب مشتاق بشه فردا هم استوری‌ها رو دنبال کنه (بدون لو دادن کامل ادامه ماجرا).\\n`;\n    }\n\n    p += `\\nبرای هر استوری این موارد رو مشخص کن:\\n`;\n    p += `- متن روی استوری (کوتاه، درشت‌خوان، حداکثر ۲-۳ خط)\\n`;\n    p += `- کپشن یا متن همراه (در صورت نیاز)\\n`;\n    p += `- پیشنهاد رنگ‌بندی و چیدمان\\n`;\n    p += `- پیشنهاد استیکر تعاملی مناسب (نظرسنجی، سوال، شمارش معکوس و ...) در صورتی که به تکنیک‌های بالا کمک کنه\\n`;\n    if(ctaOn){\n      p += `- فراخوان به اقدام واضح (دایرکت، لینک بیو، سواپ آپ) که حتماً باید در استوری باشه\\n`;\n    }\n    if(voiceVideoOn){\n      p += `- یک اشاره یا دعوت برای گوش دادن به ویس یا دیدن ویدیوی مرتبط با همین روز که در استوری بعدی یا دایرکت گذاشتی/می‌ذاری\\n`;\n    }\n\n    if(desc){\n      p += `\\nاطلاعات تکمیلی برای شخصی‌سازی استوری‌ها:\\n${desc}\\n`;\n    }\n\n    p += `\\nحالا ${count} طرح استوری رو بر اساس همه موارد بالا بساز.`;\n    return p;\n  }\n\n  if(selectedOutputType === 'post' && selectedPlatform === 'باسلام'){\n    let p = `من در باسلام یک فروشگاه دارم و دارم یک کمپین فروش ۸ روزه برای یک ${selectedCampaignType.noun} اجرا می‌کنم؛ الان روی محتوای «${d.name}» کار می‌کنم.\\n\\n`;\n    p += `⚠️ نکته بسیار مهم: طبق قوانین باسلام، هرگونه ارتباط مستقیم بین فروشنده و خریدار خارج از خود پلتفرم ممنوعه. پس در کپشن نباید هیچ شماره تماس، آیدی یا لینک شبکه‌های اجتماعی (اینستاگرام، تلگرام، واتساپ، ایتا، روبیکا، بله و ...) یا آدرس سایت باشه؛ هر دعوت به اقدام فقط باید مخاطب رو به داخل همون باسلام (چت باسلام، ثبت سفارش، صفحه محصول) هدایت کنه.\\n\\n`;\n    p += `لطفاً ${count} کپشن (توضیحات محصول) برای صفحه محصولم بنویس که همه با محور و تکنیک‌های زیر باشن (هر کپشن می‌تونه ترکیبی از این تکنیک‌ها رو با زاویه و قلاب متفاوت اجرا کنه، بدون تکراری بودن):\\n`;\n    (getSelectedTechniques(d).length ? getSelectedTechniques(d) : getTechniques(d)).forEach(t=> p += `- ${t}\\n`);\n\n    p += persuasionBlock();\n    p += `\\nقوانین نوشتن کپشن‌ها:\\n`;\n    p += `- خط اول هر کپشن یک قلاب (هوک) قوی داشته باشه که مخاطب رو مجبور کنه ادامه رو بخونه.\\n`;\n    p += `- بدنه کپشن جذاب، روان و صمیمی نوشته بشه، نه یه بلوک متن سنگین.\\n`;\n    p += `- زبان فارسی، محاوره‌ای و صمیمی، بدون کلیشه‌های تبلیغاتی خشک.\\n`;\n    p += `- هر کپشن کوتاه و مناسب صفحه محصول باشه، نه توضیح طولانی و رسمی.\\n`;\n    if(ctaOn){\n      p += `- در پایان هر کپشن یک دعوت به اقدام واضح بذار (مثل پیام دادن در چت باسلام یا ثبت سفارش)، کاملاً بدون اشاره به هیچ راه ارتباطی خارج از باسلام.\\n`;\n    }\n    if(voiceVideoOn){\n      p += `- در بخشی از کپشن، مخاطب رو به گوش دادن ویس یا دیدن ویدیوی مرتبط با همین روز (در استوری باسلام یا چت باسلام) دعوت کن یا بهش اشاره کن.\\n`;\n    }\n    if(curiosityOn){\n      p += `- آخرین جمله هر کپشن یه حس کنجکاوی ایجاد کنه که مخاطب مشتاق بشه فردا هم برگرده و ادامه محتوا رو دنبال کنه (بدون لو دادن کامل ادامه ماجرا).\\n`;\n    }\n    p += `- کپشن‌ها رو به‌صورت شماره‌گذاری‌شده و جدا از هم بنویس تا مستقیم قابل استفاده باشن.\\n`;\n\n    if(desc){\n      p += `\\nاطلاعات تکمیلی برای شخصی‌سازی کپشن‌ها:\\n${desc}\\n`;\n    }\n\n    p += `\\nحالا ${count} کپشن رو بر اساس همه موارد بالا بنویس.`;\n    return p;\n  }\n\n  let p = `من دارم یک کمپین فروش ۸ روزه برای یک ${selectedCampaignType.noun} اجرا می‌کنم و الان روی محتوای «${d.name}» کار می‌کنم.\\n\\n`;\n  p += `لطفاً ${count} پست کامل و آماده انتشار برای «${selectedPlatform}» بنویس که همه با محور و تکنیک‌های زیر باشن (هر پست می‌تونه ترکیبی از این تکنیک‌ها رو با زاویه و قلاب متفاوت اجرا کنه، بدون تکراری بودن):\\n`;\n  (getSelectedTechniques(d).length ? getSelectedTechniques(d) : getTechniques(d)).forEach(t=> p += `- ${t}\\n`);\n\n  p += persuasionBlock();\n  p += `\\nقوانین بسیار مهم ساخت مجموعه پست‌ها:\\n`;\n  p += `- این ${count} پست را به شکل یک داستان و مسیر محتوایی پیوسته بنویس؛ هر پست باید ادامه طبیعی پست قبلی باشد و به پست بعدی پل بزند. از تولید ${count} متن مستقل و بی‌ارتباط خودداری کن.\\n`;\n  p += `- پست شماره ۱ حتماً با یک قلاب بسیار قوی شروع شود؛ قلاب باید کوتاه، کنجکاوکننده و مرتبط با درد/خواسته اصلی مخاطب باشد.\\n`;\n  p += `- پست‌های بعدی باید اطلاعات و احساس پست قبلی را ادامه دهند و هر پست یک قدم داستان را جلو ببرد؛ موضوع را بی‌دلیل عوض نکن.\\n`;\n  p += `- فقط در کل مجموعه ۱ یا حداکثر ۲ سوال تعاملی داشته باش؛ سوال‌ها فقط در ابتدای یک پست یا وسط متن قرار بگیرند، نه پشت سر هم و نه در همه پست‌ها. سوال‌ها باید طبیعی و مرتبط با داستان باشند.\\n`;\n  p += `- هر پست کوتاه، خلاصه و خوش‌خوان باشد؛ از پاراگراف‌های طولانی و توضیحات اضافه خودداری کن.\\n`;\n  p += `- هر پست باید دقیقاً با کاراکتر «.» شروع شود و دقیقاً با کاراکتر «.» به پایان برسد. بعد از نقطه ابتدایی، متن اصلی را شروع کن و در انتها قبل از نقطه پایانی هیچ علامت اضافه‌ای نگذار.\\n`;\n  p += `- ${toneInstruction()}\\n`;\n  p += `- در پایان پست‌های ۱ تا ${Math.max(1, count-1)} یک جمله کوتاه کنجکاوکننده برای ادامه مسیر بگذار تا مخاطب منتظر پست بعدی/روز بعد بماند؛ ادامه را کامل لو نده.\\n`;\n  p += `- پست آخر باید جمع‌بندی طبیعی داستان و مهم‌ترین دعوت به اقدام مجموعه باشد؛ CTA اصلی فقط در پست آخر قرار بگیرد، نه اینکه پایان همه پست‌ها تکراری و تبلیغاتی شود.\\n`;\n  p += `- اگر گزینه CTA فعال است، در پست آخر CTA واضح و متناسب با «${selectedPlatform}» قرار بده: ${getCtaSuggestion()}.\\n`;\n  p += `- هر جا نیاز به تعامل گرفتن از مخاطب بود، فقط از اقدام‌هایی استفاده کن که واقعاً تو «${selectedPlatform}» وجود دارد؛ مثلاً برای ایتا/تلگرام/روبیکا/بله از «کامنت کن» استفاده نکن و به‌جایش پیام دادن به آیدی/ادمین یا عضویت در کانال را پیشنهاد بده.\\n`;\n  if(voiceVideoOn){\n    p += `- در بخشی از پست، مخاطب رو به گوش دادن ویس یا دیدن ویدیوی مرتبط با همین روز (که در استوری یا دایرکت گذاشتی/می‌ذاری) دعوت کن یا بهش اشاره کن.\\n`;\n  }\n  if(curiosityOn){\n    p += `- آخرین جمله هر پست یه حس کنجکاوی ایجاد کنه که مخاطب مشتاق بشه فردا برگرده و ادامه محتوا رو دنبال کنه (بدون لو دادن کامل ادامه ماجرا).\\n`;\n  }\n  p += `- پست‌ها رو به‌صورت شماره‌گذاری‌شده و جدا از هم بنویس تا مستقیم قابل استفاده باشن.\\n`;\n\n  if(desc){\n    p += `\\nاطلاعات تکمیلی برای شخصی‌سازی پست‌ها:\\n${desc}\\n`;\n  }\n\n  p += `\\nحالا ${count} پست را دقیقاً به صورت یک مجموعه داستانی پیوسته بنویس؛ شماره‌گذاری کن و هر پست را جدا نگه دار، اما ارتباط روایی بین آن‌ها کاملاً حفظ شود.`;\n  return p;\n}\n\ndocument.getElementById('buildBtn').addEventListener('click', ()=>{\n  const prompt = buildPrompt();\n  document.getElementById('promptOut').value = prompt;\n  document.getElementById('promptPreview').classList.add('show');\n  document.getElementById('promptPreview').scrollIntoView({behavior:'smooth', block:'start'});\n});\n\ndocument.getElementById('copyBtn').addEventListener('click', ()=>{\n  const ta = document.getElementById('promptOut');\n  ta.select();\n  navigator.clipboard.writeText(ta.value).then(()=>{\n    const msg = document.getElementById('copiedMsg');\n    msg.classList.add('show');\n    setTimeout(()=>msg.classList.remove('show'), 1800);\n  });\n});\n\ndocument.getElementById('goBtn').addEventListener('click', ()=>{\n  const text = document.getElementById('promptOut').value;\n  const url = 'https://chatgpt.com/?q=' + encodeURIComponent(text);\n  window.open(url, '_blank');\n});\n<\/script>\n<\/body>\n<\/html>\n"};
(function(){
  var KEY='merged_tools_tab',tabs=[].slice.call(document.querySelectorAll('.tab')),loaded={};
  function show(t){
    if(!SRC[t])t='paragraph';
    tabs.forEach(function(b){b.setAttribute('aria-selected',b.dataset.t===t?'true':'false')});
    [].forEach.call(document.querySelectorAll('iframe'),function(f){
      var on=f.dataset.t===t;
      f.classList.toggle('on',on);
      if(on&&!loaded[t]){loaded[t]=1;f.srcdoc=SRC[t]}
    });
    try{localStorage.setItem(KEY,t)}catch(e){}
    try{history.replaceState(null,'','#'+t)}catch(e){}
  }
  tabs.forEach(function(b){b.addEventListener('click',function(){show(b.dataset.t)})});
  var start='paragraph';
  try{start=localStorage.getItem(KEY)||start}catch(e){}
  if(location.hash&&SRC[location.hash.slice(1)])start=location.hash.slice(1);
  show(start);
})();
</script>
