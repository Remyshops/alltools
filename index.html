abel>حجم مورد نظر<\/label>\n  <div class=\"row\">\n    <input type=\"number\" id=\"size\" min=\"0.1\" step=\"any\" value=\"10\" inputmode=\"decimal\">\n    <select class=\"sm\" id=\"unit\"><option value=\"1048576\">مگابایت<\/option><option value=\"1024\">کیلوبایت<\/option><\/select>\n  <\/div>\n  <label style=\"display:flex;align-items:center;gap:8px;color:var(--tx);margin-top:12px;cursor:pointer\"><input type=\"checkbox\" id=\"eitaa\" style=\"width:auto\"> مخصوص ایتا (حداکثر ۲۰ مگابایت، بهترین کیفیت ممکن)<\/label>\n\n  <label>کیفیت تصویر (ابعاد)<\/label>\n  <select id=\"res\">\n    <option value=\"0\">خودکار (پیشنهادی)<\/option>\n    <option value=\"1080\">1080p<\/option><option value=\"720\">720p<\/option>\n    <option value=\"480\">480p<\/option><option value=\"360\">360p<\/option><option value=\"240\">240p<\/option>\n  <\/select>\n\n  <button id=\"go\" disabled>شروع تبدیل<\/button>\n  <div class=\"row\" style=\"margin-top:8px\"><button class=\"alt\" id=\"pause\" style=\"margin-top:0\" disabled>⏸ توقف موقت<\/button><button class=\"alt\" id=\"stop\" style=\"margin-top:0\" disabled>⏹ لغو<\/button><\/div>\n  <div class=\"bar\"><i id=\"pb\"><\/i><\/div>\n  <div class=\"info\" id=\"st\">یک ویدیو انتخاب کنید.<\/div>\n<\/div>\n\n<div class=\"card hide\" id=\"out\">\n  <div id=\"res-info\"><\/div>\n  <video id=\"pv\" controls playsinline><\/video>\n  <a class=\"dl\" id=\"dl\">⬇ دانلود ویدیو<\/a>\n  <button class=\"alt\" id=\"retry\">نتیجه از حجم هدف بیشتر شد؛ دوباره با دقت بیشتر<\/button>\n<\/div>\n\n<div class=\"card info\">\n  ⚡ در Chrome به‌روز (کامپیوتر و اغلب گوشی‌ها) تبدیل با «حالت سریع» انجام می‌شود و چند برابر سریع‌تر از طول ویدیو تمام می‌شود. در مرورگرها یا فایل‌هایی که حالت سریع را پشتیبانی نمی‌کنند، خودکار به روش عادی (هم‌زمان با پخش، زمان تقریباً برابر طول ویدیو) برمی‌گردد. تبدیل حتی وقتی به تب یا برنامه‌ی دیگری می‌روید ادامه پیدا می‌کند؛ با این حال بهتر است پنجره‌ی مرورگر باز بماند. حجم نهایی تقریبی است و معمولاً کمی کمتر یا بیشتر از عدد هدف می‌شود.\n<\/div>\n\n<h2>🎵 تبدیل فایل‌ها به MP3<\/h2>\n<div class=\"card\">\n  <label>فایل‌های صوتی یا ویدیویی (می‌توانید چند فایل انتخاب کنید)<\/label>\n  <input type=\"file\" id=\"afile\" accept=\"audio/*,video/*,.m4a,.aac,.ogg,.opus,.wav,.flac,.amr,.wma,.mka\" multiple>\n  <div class=\"info\" id=\"ameta\"><\/div>\n\n  <label>کیفیت صدا<\/label>\n  <select id=\"abr\">\n    <option value=\"320\">عالی — 320 kbps<\/option>\n    <option value=\"256\" selected>خیلی خوب — 256 kbps<\/option>\n    <option value=\"192\">خوب — 192 kbps<\/option>\n    <option value=\"128\">متوسط — 128 kbps<\/option>\n    <option value=\"96\">کم‌حجم — 96 kbps<\/option>\n    <option value=\"64\">خیلی کم‌حجم — 64 kbps (مناسب سخنرانی)<\/option>\n  <\/select>\n  <label style=\"display:flex;align-items:center;gap:8px;color:var(--tx);margin-top:12px;cursor:pointer\"><input type=\"checkbox\" id=\"aeitaa\" style=\"width:auto\"> مخصوص ایتا (زیر ۲۰ مگابایت، بهترین کیفیت ممکن برای هر فایل)<\/label>\n\n  <button id=\"ago\" disabled>شروع تبدیل به MP3<\/button>\n  <div class=\"bar\"><i id=\"apb\"><\/i><\/div>\n  <div class=\"info\" id=\"ast\">یک یا چند فایل انتخاب کنید.<\/div>\n<\/div>\n<div class=\"card hide\" id=\"aout\"><\/div>\n<div class=\"card info\">\n  ℹ فایل‌ها کاملاً داخل مرورگر و بدون آپلود تبدیل می‌شوند. برای بهترین کیفیت، صدا یک‌بار به‌طور کامل باز می‌شود و سپس با رمزگذار MP3 (LAME) فشرده می‌شود؛ پس برای فایل‌های خیلی طولانی (چند ساعته) ممکن است حافظه‌ی گوشی کم بیاید. در حالت ایتا، برنامه بر اساس طول فایل بالاترین بیت‌ریتی را که زیر ۲۰ مگابایت بماند انتخاب می‌کند؛ هر چه فایل کوتاه‌تر باشد کیفیت بالاتر است (تا 320 kbps).\n<\/div>\n\n<h2>📂 باز کردن پوشه با یک کلیک (ویندوز)<\/h2>\n<div class=\"card\">\n  <label>مسیر پوشه (اختیاری — معمولاً لازم نیست، ابزار خودش فایل را پیدا می‌کند)<\/label>\n  <input type=\"text\" id=\"ofpath\" placeholder=\"مثلاً D:\\Videos\" dir=\"ltr\" style=\"text-align:left\" autocomplete=\"off\">\n  <div class=\"info\">بعد از تبدیل و ذخیره، روی دکمه‌ی 📂 کلیک کنید؛ ابزار فایلی را که همین حالا با همان نام و حجم ذخیره شده پیدا می‌کند (اول Downloads، Desktop و پوشه‌های معمول، بعد بقیه‌ی درایوها) و پوشه را با فایل انتخاب‌شده باز می‌کند. پوشه‌ی پیداشده را یادش می‌ماند، پس دفعه‌های بعد فوری است. بار اول که در پوشه‌ی تازه‌ای ذخیره می‌کنید ممکن است چند ثانیه طول بکشد. فقط اگر پیدا نکرد، می‌توانید مسیر را همین‌جا بنویسید.<\/div>\n  <button class=\"alt\" id=\"ofinstall\">⬇ دانلود «ابزار ویندوز» (فقط یک‌بار)<\/button>\n  <div class=\"info\">بعد از دانلود، فایل <b>OpenFolder-Setup.bat<\/b> را یک‌بار اجرا کنید (اگر نسخه‌ی قبلی را نصب کرده‌اید، این نسخه‌ی جدید را دوباره اجرا کنید تا جایگزین شود) (ممکن است ویندوز/Chrome هشدار بدهد؛ فایل متنی و ساده است و می‌توانید با Notepad بازش کنید). این ابزار بدون دسترسی ادمین فقط یک میان‌بر <b>openfolder:<\/b> در حساب خودتان می‌سازد که همین‌قدر می‌تواند: Explorer را روی یک پوشه یا فایل موجود باز کند. بار اول Chrome می‌پرسد؛ گزینه‌ی «Always allow» را بزنید. برای حذف: در CMD دستور <span dir=\"ltr\">reg delete HKCU\\Software\\Classes\\openfolder /f<\/span>.<\/div>\n<\/div>\n<\/main>\n\n<script>\n\"use strict\";\nvar Mp4Muxer = (() => {\n  var __defProp = Object.defineProperty;\n  var __getOwnPropDesc = Object.getOwnPropertyDescriptor;\n  var __getOwnPropNames = Object.getOwnPropertyNames;\n  var __hasOwnProp = Object.prototype.hasOwnProperty;\n  var __export = (target, all) => {\n    for (var name in all)\n      __defProp(target, name, { get: all[name], enumerable: true });\n  };\n  var __copyProps = (to, from, except, desc) => {\n    if (from && typeof from === \"object\" || typeof from === \"function\") {\n      for (let key of __getOwnPropNames(from))\n        if (!__hasOwnProp.call(to, key) && key !== except)\n          __defProp(to, key, { get: () => from[key], enumerable: !(desc = __getOwnPropDesc(from, key)) || desc.enumerable });\n    }\n    return to;\n  };\n  var __toCommonJS = (mod) => __copyProps(__defProp({}, \"__esModule\", { value: true }), mod);\n  var __accessCheck = (obj, member, msg) => {\n    if (!member.has(obj) ><canvas id=\"ov\"><\/canvas>\n  <\/div>\n  <div id=\"ctl\" style=\"display:none\">\n    <div class=\"row\">\n      <button id=\"play\">▶ پخش<\/button>\n      <input type=\"range\" id=\"seek\" min=\"0\" max=\"1000\" value=\"0\">\n      <span id=\"tm\" class=\"hint\">0:00<\/span>\n    <\/div>\n    <div class=\"row\">\n      <button id=\"b1m\">‹ ۱ ثانیه<\/button><button id=\"b01m\">‹ ۰.۱<\/button>\n      <button id=\"b01p\">۰.۱ ›<\/button><button id=\"b1p\">۱ ثانیه ›<\/button>\n    <\/div>\n    <div id=\"cutbar\" style=\"position:relative;height:6px;background:var(--bd);border-radius:3px;margin-top:8px;overflow:hidden\"><\/div>\n    <div class=\"row\">\n      <b>✂ برش:<\/b>\n      <button id=\"cs\">شروع برش (اینجا)<\/button>\n      <button id=\"ccan\" style=\"display:none\">لغو<\/button>\n      <button id=\"cfs\">حذف از ابتدا تا اینجا<\/button>\n      <button id=\"cte\">حذف از اینجا تا انتها<\/button>\n      <span id=\"cr\" class=\"hint\"><\/span>\n    <\/div>\n    <div class=\"row\" id=\"clist\"><\/div>\n    <p class=\"hint\">روی تصویر بکشید تا ناحیه‌ی واترمارک را انتخاب کنید (چند ناحیه هم می‌شود).<\/p>\n    <div class=\"row\">\n      <label>روش:\n        <select id=\"mode\">\n          <option value=\"crop\">برش و زوم هوشمند (دقیق و ۱۰۰٪ تمیز)<\/option>\n          <option value=\"inpaint\">پر کردن ساده (فقط لوگوی خیلی کوچک)<\/option>\n          <option value=\"blur\">محو (Blur)<\/option>\n          <option value=\"pixel\">موزاییکی<\/option>\n        <\/select>\n      <\/label>\n      <label>شدت: <input type=\"range\" id=\"str\" min=\"2\" max=\"40\" value=\"16\"><\/label>\n      <label>حاشیه‌ی اضافه: <input type=\"range\" id=\"pad\" min=\"0\" max=\"20\" value=\"3\"><\/label>\n    <\/div>\n    <div class=\"row\" id=\"list\"><\/div>\n    <div class=\"row\">\n      <button id=\"undo\">بازگردانی آخرین ناحیه<\/button>\n      <button id=\"clear\">پاک کردن همه<\/button>\n      <button class=\"p\" id=\"exp\">خروجی گرفتن<\/button>\n    <\/div>\n    <div class=\"bar\" id=\"bar\"><i id=\"bi\"><\/i><\/div>\n    <p class=\"hint\" id=\"msg\"><\/p>\n  <\/div>\n<\/div>\n<p class=\"hint\">نکته: خروجی به‌صورت بلادرنگ ضبط می‌شود؛ زمان آن برابر مدت ویدیوست و تا پایان کار باید این تب باز و فعال بماند.<\/p>\n<\/div>\n\n<script>\nconst $=id=>document.getElementById(id);\nconst video=document.createElement('video');\nvideo.playsInline=true;\nconst cv=$('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});\nconst ov=$('ov'),octx=ov.getContext('2d');\nconst px=document.createElement('canvas'),pctx=px.getContext('2d');\nlet cuts=[],cs=null,ce=null,rec=null,skipping=false;\nlet rects=[],drag=null,exporting=false,url=null,actx=null,adest=null,fname='video';\n\nfunction loadFile(f){\n  if(!f)return;\n  if(url)URL.revokeObjectURL(url);\n  fname=f.name.replace(/\\.[^.]+$/,'');\n  url=URL.createObjectURL(f);\n  video.src=url;rects=[];cuts=[];cs=ce=null;renderList();\n  video.onloadedmetadata=()=>{\n    cv.width=ov.width=video.videoWidth;cv.height=ov.height=video.videoHeight;\n    $('stage').style.display='block';$('ctl').style.display='block';\n    $('drop').style.display='none';video.currentTime=0;renderCuts();\n  };\n}\n$('drop').onclick=()=>$('file').click();\n$('file').onchange=e=>loadFile(e.target.files[0]);\n['dragover','drop'].forEach(ev=>document.addEventListener(ev,e=>{\n  e.preventDefault();\n  if(ev==='drop')loadFile(e.dataTransfer.files[0]);\n}));\n\nconst fmt=t=>{t=Math.floor(t||0);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};\n\nfunction apply(r){\n  const pad=+$('pad').value,s=+$('str').value,mode=$('mode').value,W=cv.width,H=cv.height;\n  let x=Math.max(1,Math.round(r.x-pad)),y=Math.max(1,Math.round(r.y-pad));\n  let w=Math.min(W-1,Math.round(r.x+r.w+pad))-x,h=Math.min(H-1,Math.round(r.y+r.h+pad))-y;\n  if(w<2||h<2)return;\n  if(mode==='inpaint'){\n    const sw=w+2,sh=h+2,src=ctx.getImageData(x-1,y-1,sw,sh).data;\n    const out=ctx.createImageData(w,h),o=out.data;\n    const P=(i,j)=>(j*sw+i)*4;\n    for(let j=0;j<h;j++){\n      const ty=(j+1)/(h+1),dv=Math.min(j+1,h-j),wv=1/(dv+1);\n      for(let i=0;i<w;i++){\n        const tx=(i+1)/(w+1),dh=Math.min(i+1,w-i),wh=1/(dh+1);\n        const L=P(0,j+1),R=P(w+1,j+1),T=P(i+1,0),B=P(i+1,h+1),k=(j*w+i)*4;\n        for(let c=0;c<3;c++){\n          const hz=src[L+c]*(1-tx)+src[R+c]*tx;\n          const vt=src[T+c]*(1-ty)+src[B+c]*ty;\n          o[k+c]=(hz*wh+vt*wv)/(wh+wv);\n        }\n        o[k+3]=255;\n      }\n    }\n    ctx.putImageData(out,x,y);\n    // نرم‌کردن اثر با یک محو سبک\n    ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();\n    if('filter' in ctx){ctx.filter='blur(1.5px)';ctx.drawImage(cv,0,0);}\n    ctx.restore();\n  }else if(mode==='blur'){\n    ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();\n    if('filter' in ctx){ctx.filter='blur('+s+'px)';ctx.drawImage(video,0,0,W,H);}\n    else{pixelate(x,y,w,h,s);}\n    ctx.restore();\n  }else pixelate(x,y,w,h,s);\n}\nlet cropCache={};\nfunction cropBox(){\n  const W=cv.width,H=cv.height,pad=+$('pad').value,key=JSON.stringify(rects)+pad+'|'+W+'x'+H;\n  if(cropCache.key===key)return cropCache.box;\n  let box={x:0,y:0,w:W,h:H,ok:true};\n  if(rects.length){\n    const R=rects.map(r=>({x0:r.x-pad,y0:r.y-pad,x1:r.x+r.w+pad,y1:r.y+r.h+pad}));\n    box=null;\n    for(let sc=1;sc>=0.3&&!box;sc-=0.005){\n      const w=Math.floor(W*sc)&~1,h=Math.floor(H*sc)&~1;\n      const st=Math.max(2,Math.round(W/150)),xs=[],ys=[];\n      for(let x=0;x<W-w;x+=st)xs.push(x);xs.push(W-w);\n      for(let y=0;y<H-h;y+=st)ys.push(y);ys.push(H-h);\n      let bd=1e18;\n      for(const x of xs)for(const y of ys){\n        if(R.some(r=>x<r.x1&&x+w>r.x0&&y<r.y1&&y+h>r.y0))continue;\n        const d=Math.hypot(x+w/2-W/2,y+h/2-H/2);\n        if(d<bd){bd=d;box={x,y,w,h,ok:true}}\n      }\n    }\n    if(!box)box={x:0,y:0,w:W,h:H,ok:false};\n  }\n  cropCache={key,box};return box;\n}\nfunction pixelate(x,y,w,h,s){\n  const bs=Math.max(2,s);\n  px.width=Math.max(1,Math.ceil(w/bs));px.height=Math.max(1,Math.ceil(h/bs));\n  pctx.imageSmoothingEnabled=true;\n  pctx.drawImage(cv,x,y,w,h,0,0,px.width,px.height);\n  ctx.save();ctx.imageSmoothingEnabled=false;\n  ctx.drawImage(px,0,0,px.width,px.height,x,y,w,h);ctx.restore();\n}\n\n\nconst fmt2=t=>{const m=Math.floor(t/60),x=t%60;return m+':'+(x<10?'0':'')+x.toFixed(1)};\nfunction segs(){\n  const D=video.duration||0,out=[];let p=0;\n  for(const c of cuts){if(c.a>p)out.push([p,c.a]);p=Math.max(p,c.b)}\n  if(p<D)out.push([p,D]);\n  return out;\n}\nconst edDur=()=>segs().reduce((a,g)=>a+g[1]-g[0],0);\nfunction toEd(t){\n  let e=0;\n  for(const g of segs()){if(t>=g[1])e+=g[1]-g[0];else{if(t>g[0])e+=t-g[0];return e}}\n  return e;\n}\nfunction toSrc(e){\n  let acc=0;const sg=segs();\n  for(const g of sg){const L=g[1]-g[0];if(e<=acc+L)return g[0]+Math.max(0,e-acc);acc+=L}\n  return sg.length?sg[sg.length-1][1]:0;\n}\nfunction renderCuts(){\n  const D=video.duration||1;\n  let h=cuts.map(c=>'<i style=\"position:absolute;top:0;bottom:0;background:var(--dn);left:'+(c.a/D*100)+'%;width:'+((c.b-c.a)/D*100)+'%\"><\/i>').join('');\n  if(cs!=null)h+='<i style=\"position:absolute;top:0;bottom:0;width:3px;background:#f59e0b;left:'+(cs/D*100)+'%\"><\/i>';\n  $('cutbar').innerHTML=h;\n  $('clist').innerHTML='';\n  cuts.forEach((c,i)=>{\n    const e=document.createElement('span');e.className='chip';\n    e.innerHTML='حذف‌شده: '+fmt2(c.a)+' تا '+fmt2(c.b)+' <b title=\"بازگردانی\">✕<\/b>';\n    e.querySelector('b').onclick=()=>{const t=toEd(video.currentTime);cuts.splice(i,1);renderCuts();video.currentTime=toSrc(t)};\n    $('clist').appendChild(e);\n  });\n  $('cs').textContent=cs==null?'شروع برش (اینجا)':'پایان برش (اینجا) ✂';\n  $('ccan').style.display=cs==null?'none':'';\n  $('cr').textContent=cs==null?'':'شروع از '+fmt2(cs)+' ثبت شد؛ به محل پایان بروید و دوباره بزنید.';\n}\nfunction addCut(a,b){\n  if(b-a<0.05)return;\n  const old=cuts;\n  cuts=cuts.concat([{a,b}]).sort((x,y)=>x.a-y.a);\n  const m=[];cuts.forEach(c=>{const l=m[m.length-1];if(l&&c.a<=l.b)l.b=Math.max(l.b,c.b);else m.push({a:c.a,b:c.b})});\n  cuts=m;\n  if(edDur()<0.1){cuts=old;$('msg').textContent='نمی‌شود کل ویدیو را حذف کرد.';return}\n  $('msg').textContent='';\n  video.currentTime=Math.min(video.currentTime>=a&&video.currentTime<b?b:video.currentTime,video.duration);\n  renderCuts();\n}\n$('cs').onclick=()=>{\n  const t=video.currentTime;\n  if(cs==null){cs=t;renderCuts();return}\n  if(t<=cs){$('msg').textContent='پایان برش باید بعد از شروع آن باشد.';return}\n  const a=cs;cs=null;addCut(a,t);\n};\n$('ccan').onclick=()=>{cs=null;renderCuts()};\n$('cfs').onclick=()=>{addCut(0,video.currentTime)};\n$('cte').onclick=()=>{addCut(video.currentTime,video.duration+1);if(!video.paused)video.pause()};\nconst step=d=>{video.pause();video.currentTime=toSrc(Math.max(0,Math.min(edDur(),toEd(video.currentTime)+d)))};\n$('b1m').onclick=()=>step(-1);$('b01m').onclick=()=>step(-.1);\n$('b01p').onclick=()=>step(.1);$('b1p').onclick=()=>step(1);\nfunction stopRec(){\n  if(rec&&rec.state!=='inactive'){const r=rec;setTimeout(()=>{if(r.state!=='inactive')r.stop()},200)}\n}\nfunction skipTo(end){\n  if(end>=video.duration-0.05){\n    video.pause();\n    if(exporting)stopRec();else video.currentTime=Math.max(0,toSrc(edDur())-0.05);\n    return;\n  }\n  skipping=true;\n  if(rec&&rec.state==='recording')rec.pause();\n  const done=()=>{if(!skipping)return;skipping=false;if(rec&&rec.state==='paused')rec.resume()};\n  video.addEventListener('seeked',done,{once:true});\n  setTimeout(done,1500);\n  video.currentTime=end;\n}\nfunction checkSkip(){\n  if(video.paused||skipping||!cuts.length)return false;\n  const t=video.currentTime,c=cuts.find(c=>t>=c.a-0.02&&t<c.b);\n  if(c){skipTo(c.b);return true}\n  return false;\n}\nsetInterval(checkSkip,25);\nvideo.addEventListener('timeupdate',checkSkip);\nfunction frame(){\n  const skipped=checkSkip();\n  if(video.readyState>=2&&!skipped&&!skipping){\n    const mode=$('mode').value;\n    if(mode==='crop'){\n      if(exporting){const c=cropBox();ctx.drawImage(video,c.x,c.y,c.w,c.h,0,0,cv.width,cv.height)}\n      else ctx.drawImage(video,0,0,cv.width,cv.height);\n    }else{ctx.drawImage(video,0,0,cv.width,cv.height);rects.forEach(apply)}\n    $('tm').textContent=fmt(toEd(video.currentTime))+' / '+fmt(edDur());\n    if(!seeking)$('seek').value=edDur()?toEd(video.currentTime)/edDur()*1000:0;\n    if(exporting)$('bi').style.width=(toEd(video.currentTime)/edDur()*100)+'%';\n  }\n  octx.clearRect(0,0,ov.width,ov.height);\n  if(!exporting){\n    octx.lineWidth=Math.max(2,cv.width/400);octx.strokeStyle='#ff3b30';octx.fillStyle='rgba(255,59,48,.15)';\n    octx.setLineDash([8,6]);\n    if($('mode').value==='crop'&&rects.length){\n      const c=cropBox();\n      octx.setLineDash([]);octx.fillStyle='rgba(0,0,0,.6)';\n      octx.fillRect(0,0,ov.width,c.y);octx.fillRect(0,c.y+c.h,ov.width,ov.height-c.y-c.h);\n      octx.fillRect(0,c.y,c.x,c.h);octx.fillRect(c.x+c.w,c.y,ov.width-c.x-c.w,c.h);\n      octx.strokeStyle='#22c55e';octx.strokeRect(c.x,c.y,c.w,c.h);\n      octx.strokeStyle='#ff3b30';octx.fillStyle='rgba(255,59,48,.15)';octx.setLineDash([8,6]);\n      $('msg').textContent=c.ok?('بخش سبز نگه داشته می‌شود؛ زوم تقریبی ×'+(cv.width/c.w).toFixed(2)+' ('+Math.round((1-c.w*c.h/(cv.width*cv.height))*100)+'٪ از کادر کم می‌شود)'):'با این ناحیه‌ها نمی‌شود بدون برش زیاد (بیش از ۷۰٪) جلو رفت؛ ناحیه‌ها را کوچک‌تر کنید.';\n    }\n    const all=drag?rects.concat([norm(drag)]):rects;\n    all.forEach(r=>{octx.fillRect(r.x,r.y,r.w,r.h);octx.strokeRect(r.x,r.y,r.w,r.h)});\n  }\n  requestAnimationFrame(frame);\n}\nrequestAnimationFrame(frame);\n\nlet seeking=false;\n$('seek').oninput=e=>{seeking=true;video.currentTime=toSrc(e.target.value/1000*edDur())};\n$('seek').onchange=()=>seeking=false;\n$('play').onclick=()=>{video.paused?video.play():video.pause()};\nvideo.onplay=()=>$('play').textContent='⏸ توقف';\nvideo.onpause=()=>$('play').textContent='▶ پخش';\n\nconst norm=d=>({x:Math.min(d.x0,d.x1),y:Math.min(d.y0,d.y1),w:Math.abs(d.x1-d.x0),h:Math.abs(d.y1-d.y0)});\nfunction pos(e){\n  const b=ov.getBoundingClientRect();\n  return [(e.clientX-b.left)*ov.width/b.width,(e.clientY-b.top)*ov.height/b.height];\n}\nov.onpointerdown=e=>{if(exporting)return;ov.setPointerCapture(e.pointerId);const[a,b]=pos(e);drag={x0:a,y0:b,x1:a,y1:b}};\nov.onpointermove=e=>{if(drag){[drag.x1,drag.y1]=pos(e)}};\nov.onpointerup=()=>{\n  if(!drag)return;const r=norm(drag);drag=null;\n  if(r.w>4&&r.h>4){rects.push(r);renderList()}\n};\nfunction renderList(){\n  $('list').innerHTML='';\n  rects.forEach((r,i)=>{\n    const c=document.createElement('span');c.className='chip';\n    c.innerHTML='ناحیه '+(i+1)+' <b title=\"حذف\">✕<\/b>';\n    c.querySelector('b').onclick=()=>{rects.splice(i,1);renderList()};\n    $('list').appendChild(c);\n  });\n}\n$('undo').onclick=()=>{rects.pop();renderList()};\n$('clear').onclick=()=>{rects=[];renderList()};\n\n$('exp').onclick=async()=>{\n  if(!url||exporting)return;\n  if(!rects.length&&!cuts.length){$('msg').textContent='ابتدا یک ناحیه انتخاب کنید یا بخشی را برای حذف مشخص کنید.';return}\n  if(typeof MediaRecorder==='undefined'){$('msg').textContent='مرورگر شما از ضبط پشتیبانی نمی‌کند؛ Chrome یا Edge را امتحان کنید.';return}\n  const types=['video/mp4;codecs=avc1,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];\n  const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';\n  const ext=mime.includes('mp4')?'mp4':'webm';\n  let handle=null,writable=null,chain=Promise.resolve();\n  if(window.showSaveFilePicker){\n    try{\n      handle=await showSaveFilePicker({\n        suggestedName:fname+'-clean.'+ext,\n        types:[{description:ext==='mp4'?'ویدیوی MP4':'ویدیوی WebM',accept:{[ext==='mp4'?'video/mp4':'video/webm']:['.'+ext]}}]\n      });\n      writable=await handle.createWritable();\n    }catch(err){\n      if(err&&err.name==='AbortError'){$('msg').textContent='ذخیره لغو شد.';return}\n      handle=null;writable=null;\n    }\n  }\n  exporting=true;$('exp').disabled=true;$('bar').style.display='block';$('bi').style.width='0';\n  $('msg').textContent='در حال پردازش… تب را باز نگه دارید.';\n  video.pause();skipping=false;\n  video.currentTime=toSrc(0);\n  await Promise.race([new Promise(r=>video.addEventListener('seeked',r,{once:true})),new Promise(r=>setTimeout(r,800))]);\n  const stream=cv.captureStream(30);\n  try{\n    if(!actx){\n      actx=new (window.AudioContext||window.webkitAudioContext)();\n      const src=actx.createMediaElementSource(video);\n      adest=actx.createMediaStreamDestination();src.connect(adest);\n    }\n    await actx.resume();\n    adest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));\n  }catch(err){console.warn('audio',err)}\n  rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:8e6}:{videoBitsPerSecond:8e6});\n  const chunks=[];\n  rec.ondataavailable=e=>{\n    if(!e.data.size)return;\n    if(writable){const d=e.data;chain=chain.then(()=>writable.write(d))}else chunks.push(e.data);\n  };\n  rec.onstop=async()=>{\n    try{\n      if(writable){await chain;await writable.close();$('msg').textContent='ذخیره شد: '+handle.name}\n      else{\n        const e2=(rec.mimeType||mime).includes('mp4')?'mp4':'webm';\n        const blob=new Blob(chunks,{type:rec.mimeType||mime});\n        const u=URL.createObjectURL(blob);\n        $('msg').innerHTML='تمام شد: <a class=\"dl\" href=\"'+u+'\" download=\"'+fname+'-clean.'+e2+'\">دانلود ویدیو ('+(blob.size/1048576).toFixed(1)+' MB)<\/a>';\n      }\n    }catch(err){$('msg').textContent='خطا در ذخیره: '+err.message}\n    exporting=false;$('exp').disabled=false;$('bar').style.display='none';\n    video.currentTime=toSrc(0);\n  };\n  video.onended=()=>stopRec();\n  rec.start(500);\n  video.play();\n};\n<\/script>\n<\/body>\n<\/html>\n", "paragraph": "<!DOCTYPE html>\n<html lang=\"fa\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>پاراگراف‌بندی<\/title>\n<style>\nbody{margin:0;font-family:Tahoma,Vazirmatn,sans-serif;font-size:20px;background:#f5f6fa;color:#1d2433}\n.wrap{max-width:720px;margin:0 auto;padding:18px}\nh1{font-size:28px;margin:0 0 16px;text-align:center}\n.box{background:#fff;border:1px solid #dfe3ec;border-radius:14px;padding:16px;margin-bottom:16px}\nh2{font-size:20px;margin:0 0 10px}\ntextarea{width:100%;min-height:220px;font:inherit;font-size:20px;line-height:1.8;padding:12px;border:2px solid #aab;border-radius:10px;box-sizing:border-box}\n.marks{display:flex;flex-wrap:wrap;gap:8px}\n.marks button{font-size:26px;min-width:60px;height:60px;padding:0 10px;border:2px solid #dfe3ec;border-radius:12px;background:#fff;cursor:pointer;font-family:inherit}\n.marks button.on{border-color:#5b5bd6;background:#e6e6ff}\n.marks button.rb{font-size:18px}\n.sub{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed #dfe3ec}\n.sub.show{display:block}\n.sub p{margin:0 0 8px;font-size:17px;color:#6b7385}\n.sub button{font-size:18px;min-width:60px;height:52px;padding:0 10px}\n#cus{font:inherit;font-size:20px;padding:10px;width:100%;margin-top:12px;border:2px solid #aab;border-radius:10px;box-sizing:border-box}\n.erow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eef0f5}\n.erow .tx{flex:1;font-size:18px;overflow-wrap:anywhere}\n.erow select{font:inherit;font-size:22px;padding:6px;border:2px solid #aab;border-radius:10px;background:#fff;min-width:110px;flex:0 0 auto}\n.empty{color:#6b7385;font-size:17px}\n.btn{font:inherit;font-size:20px;padding:14px 18px;margin:4px;border-radius:12px;border:2px solid #5b5bd6;background:#fff;color:#1d2433;cursor:pointer}\n.btn.p{background:#5b5bd6;color:#fff;font-weight:700}\n#prev{background:#fff;border:2px dashed #aab;border-radius:12px;padding:16px;min-height:140px;line-height:1.9;font-size:20px;overflow-wrap:anywhere;color:#111}\n.msg{min-height:26px;color:#1a7f37;font-size:18px;margin-top:8px;text-align:center}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<h1>✍️ پاراگراف‌بندی<\/h1>\n\n<div class=\"box\">\n<h2>۱. متن را اینجا بنویس<\/h2>\n<p style=\"margin:0 0 10px;font-size:17px;color:#6b7385\">سطر اول تیتر می‌شود. هر سطر بعدی یک نشانه می‌گیرد.<\/p>\n<textarea id=\"src\"><\/textarea>\n<div style=\"margin-top:10px\"><button class=\"btn\" id=\"smp\">متن آزمایشی<\/button><\/div>\n<\/div>\n\n<div class=\"box\">\n<h2>۲. نشانه را انتخاب کن<\/h2>\n<div class=\"marks\" id=\"marks\"><\/div>\n<div class=\"sub\" id=\"sub\">\n<p>نوع رنگین‌کمان را انتخاب کن:<\/p>\n<div class=\"marks\" id=\"subm\"><\/div>\n<\/div>\n<input type=\"text\" id=\"cus\" placeholder=\"یا نشانه دلخواه خودت را اینجا بنویس\">\n<\/div>\n\n<div class=\"box\">\n<h2>۳. نشانه هر سطر را جداگانه تغییر بده (اختیاری)<\/h2>\n<div id=\"ed\"><\/div>\n<\/div>\n\n<div class=\"box\">\n<h2>۴. اندازه متن<\/h2>\n<button class=\"btn\" id=\"big\">A+ بزرگ‌تر<\/button>\n<button class=\"btn\" id=\"small\">A- کوچک‌تر<\/button>\n<\/div>\n\n<div class=\"box\">\n<h2>پیش‌نمایش<\/h2>\n<div id=\"prev\"><\/div>\n<div style=\"text-align:center;margin-top:14px\">\n<button class=\"btn p\" id=\"copy\">📋 کپی برای ارسال<\/button>\n<button class=\"btn\" id=\"clr\">پاک کردن<\/button>\n<\/div>\n<div class=\"msg\" id=\"msg\"><\/div>\n<\/div>\n<\/div>\n\n<script>\nvar SAMPLE = \"فواید مطالعه روزانه\\nافزایش تمرکز و دقت ذهن\\nتقویت دایره لغات و مهارت نوشتن\\nکاهش استرس پیش از خواب\\nبهبود کیفیت خواب\\n\\nنتیجه‌گیری\\nروزی ۲۰ دقیقه مطالعه کافی است\";\n\nvar RB_SETS = [\n  {v:'circle', label:'🔴🟠', list:['🔴','🟠','🟡','🟢','🔵','🟣']},\n  {v:'square', label:'🟥🟧', list:['🟥','🟧','🟨','🟩','🟦','🟪']},\n  {v:'heart',  label:'❤️🧡', list:['❤️','🧡','💛','💚','💙','💜']},\n  {v:'flower', label:'🌸🌼', list:['🌸','🌼','🌻','🌷','🌹','🌺']}\n];\nvar MARKS = [\n  {v:'🔴', label:'🔴'},\n  {v:'🟢', label:'🟢'},\n  {v:'🔵', label:'🔵'},\n  {v:'✅', label:'✅'},\n  {v:'👉', label:'👉'},\n  {v:'⭐', label:'⭐'},\n  {v:'🌸', label:'🌸'},\n  {v:'🍯', label:'🍯'},\n  {v:'num', label:'۱.'},\n  {v:'rainbow', label:'🌈 رنگین‌کمان', cls:'rb'}\n];\nvar CHOICES = ['🔴','🟠','🟡','🟢','🔵','🟣','✅','❌','👉','⭐','🌸','🍯','🚗','🏠','💡','📌','🔥','💰'];\n\nvar cur = '🔴';\nvar rbSet = 'circle';\nvar fs = 18;\nvar ov = {};\nvar CLR = /^(\\s|[-•*]|\\d+[.)]\\s|\\p{Extended_Pictographic}|\\uFE0F|\\u200D)+/u;\nvar FA = '۰۱۲۳۴۵۶۷۸۹';\n\nfunction $(id){ return document.getElementById(id); }\nfunction esc(s){ return s.replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;'); }\nfunction clean(s){ return s.replace(CLR,'').trim(); }\nfunction toFa(n){ return String(n).replace(/[0-9]/g, function(d){ return FA[d]; }); }\nfunction currentSet(){\n  for (var k = 0; k < RB_SETS.length; k++) if (RB_SETS[k].v === rbSet) return RB_SETS[k];\n  return RB_SETS[0];\n}\n\nfunction autoMarker(idx){\n  var custom = $('cus').value.trim();\n  if (custom) return custom;\n  if (cur === 'num') return toFa(idx) + '.';\n  if (cur === 'rainbow') { var l = currentSet().list; return l[(idx - 1) % l.length]; }\n  return cur;\n}\n\n// Returns one entry per content line: {i, t, m} where m is the marker ('none' = no marker)\nfunction collect(){\n  var lines = $('src').value.replace(/\\r/g,'').split('\\n');\n  var i = 0;\n  while (i < lines.length && !lines[i].trim()) i++;\n  var ti = i;\n  var rows = [], idx = 0;\n  for (var j = ti + 1; j < lines.length; j++) {\n    var t = clean(lines[j]);\n    if (!t) { rows.push({i:j, t:'', m:null}); continue; }\n    idx++;\n    var m = (ov[j] !== undefined) ? ov[j] : autoMarker(idx);\n    rows.push({i:j, t:t, m:m});\n  }\n  return {title: ti < lines.length ? clean(lines[ti]) : null, rows: rows};\n}\n\nfunction render(){\n  var data = collect();\n  var out = '';\n  if (data.title !== null) {\n    out += '<div style=\"font-size:'+Math.round(fs*1.4)+'px;font-weight:800;margin-bottom:12px\">'+esc(data.title)+'<\/div>';\n  }\n  data.rows.forEach(function(r){\n    if (r.m === null) { out += '<div style=\"height:14px\"><\/div>'; return; }\n    var head = (r.m === 'none' || r.m === '') ? '' : esc(r.m) + ' ';\n    out += '<div style=\"margin-bottom:10px;padding-right:1.6em;text-indent:-1.6em\">'+head+esc(r.t)+'<\/div>';\n  });\n  $('prev').innerHTML = out;\n  $('prev').style.fontSize = fs + 'px';\n  paintMarks();\n  renderEditor(data);\n}\n\nfunction renderEditor(data){\n  var ed = $('ed');\n  ed.innerHTML = '';\n  var any = false;\n  data.rows.forEach(function(r){\n    if (r.m === null) return;\n    any = true;\n    var row = document.createElement('div');\n    row.className = 'erow';\n\n    var sel = document.createElement('select');\n    var current = (r.m === '' ? 'none' : r.m);\n    var opts = [['none','بدون نشانه']];\n    CHOICES.forEach(function(c){ opts.push([c, c]); });\n    var known = opts.some(function(o){ return o[0] === current; });\n    if (!known) opts.push([current, current]);\n    opts.forEach(function(o){\n      var op = document.createElement('option');\n      op.value = o[0];\n      op.textContent = o[1];\n      sel.appendChild(op);\n    });\n    sel.value = current;\n    (function(i){\n      sel.onchange = function(){ ov[i] = sel.value; render(); };\n    })(r.i);\n\n    var tx = document.createElement('div');\n    tx.className = 'tx';\n    tx.textContent = r.t;\n\n    row.appendChild(sel);\n    row.appendChild(tx);\n    ed.appendChild(row);\n  });\n  if (!any) {\n    var p = document.createElement('div');\n    p.className = 'empty';\n    p.textContent = 'اول متن را در بخش ۱ بنویس تا سطرها اینجا ظاهر شوند.';\n    ed.appendChild(p);\n  }\n}\n\nfunction paintMarks(){\n  var on0 = !$('cus').value.trim();\n  var btns = $('marks').querySelectorAll('button');\n  for (var k = 0; k < btns.length; k++) {\n    var on = on0 && btns[k].dataset.v === cur;\n    btns[k].className = (btns[k].dataset.cls || '') + (on ? ' on' : '');\n  }\n  $('sub').className = (cur === 'rainbow') ? 'sub show' : 'sub';\n  var subs = $('subm').querySelectorAll('button');\n  for (var j = 0; j < subs.length; j++) {\n    subs[j].className = (on0 && cur === 'rainbow' && subs[j].dataset.v === rbSet) ? 'on' : '';\n  }\n}\n\nfunction say(t){\n  $('msg').textContent = t;\n  setTimeout(function(){ $('msg').textContent = ''; }, 2500);\n}\n\nMARKS.forEach(function(m){\n  var b = document.createElement('button');\n  b.type = 'button';\n  b.dataset.v = m.v;\n  if (m.cls) b.dataset.cls = m.cls;\n  b.textContent = m.label;\n  b.onclick = function(){ cur = m.v; $('cus').value = ''; ov = {}; render(); };\n  $('marks').appendChild(b);\n});\n\nRB_SETS.forEach(function(s){\n  var b = document.createElement('button');\n  b.type = 'button';\n  b.dataset.v = s.v;\n  b.textContent = s.label;\n  b.onclick = function(){ rbSet = s.v; cur = 'rainbow'; $('cus').value = ''; ov = {}; render(); };\n  $('subm').appendChild(b);\n});\n\n$('cus').addEventListener('input', function(){ ov = {}; render(); });\n$('src').addEventListener('input', render);\n$('big').onclick = function(){ if (fs < 28) { fs += 2; render(); } };\n$('small').onclick = function(){ if (fs > 14) { fs -= 2; render(); } };\n$('smp').onclick = function(){ $('src').value = SAMPLE; ov = {}; render(); };\n$('clr').onclick = function(){ $('src').value = ''; ov = {}; render(); };\n\n$('copy').onclick = function(){\n  var r = document.createRange();\n  r.selectNodeContents($('prev'));\n  var s = window.getSelection();\n  s.removeAllRanges();\n  s.addRange(r);\n  try {\n    document.execCommand('copy');\n    say('کپی شد ✓');\n  } catch (e) {\n    say('لطفاً متن پیش‌نمایش را دستی کپی کنید');\n  }\n  s.removeAllRanges();\n};\n\nrender();\n<\/script>\n<\/body>\n<\/html>\n", "github": "<!DOCTYPE html>\n<html lang=\"fa\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>مبدل آدرس گیت‌هاب به گیت‌هاب پیجز<\/title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap\">\n<style>\n:root{--bg:#f6f7fb;--card:#fff;--text:#1b1f2a;--muted:#6b7280;--brand:#2563eb;--brand-t:#fff;--line:#e3e6ee;--ok:#15803d;--bad:#b91c1c;--code:#eef2ff;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0f1218;--card:#181c25;--text:#e8eaf0;--muted:#9aa3b2;--brand:#5b8cff;--brand-t:#0b0f18;--line:#2a3040;--ok:#4ade80;--bad:#f87171;--code:#222a3d}}\n:root[data-theme=\"dark\"]{--bg:#0f1218;--card:#181c25;--text:#e8eaf0;--muted:#9aa3b2;--brand:#5b8cff;--brand-t:#0b0f18;--line:#2a3040;--ok:#4ade80;--bad:#f87171;--code:#222a3d}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--text);font-family:\"Vazirmatn\",Tahoma,system-ui,sans-serif;line-height:1.8}\nmain{max-width:720px;margin:0 auto;padding:24px 16px}\nh1{font-size:1.4rem;font-weight:800;margin:8px 0}\np.sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}\n.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}\ntextarea{width:100%;min-height:110px;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:10px;font:inherit;direction:ltr;text-align:left;resize:vertical}\nbutton{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 16px;background:var(--brand);color:var(--brand-t);font-weight:600}\nbutton.alt{background:var(--code);color:var(--text)}\n.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}\n.res{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}\n.res:first-child{border-top:0;padding-top:0;margin-top:0}\n.in{color:var(--muted);font-size:.8rem;direction:ltr;text-align:left;overflow-wrap:anywhere}\n.out{direction:ltr;text-align:left;background:var(--code);border-radius:8px;padding:8px 10px;margin:6px 0;overflow-wrap:anywhere;font-family:ui-monospace,Consolas,monospace;font-size:.9rem}\n.note{font-size:.85rem;color:var(--muted)}\n.err{color:var(--bad)}\n.tag{font-size:.75rem;color:var(--ok)}\n<\/style>\n<\/head>\n<body>\n<main>\n<h1>مبدل آدرس گیت‌هاب ← گیت‌هاب پیجز<\/h1>\n<p class=\"sub\">هر آدرس GitHub رو بچسبون (هر خط یک آدرس)، آدرس سایتش رو می‌گیری.<\/p>\n<div class=\"card\">\n<textarea id=\"in\" placeholder=\"https://github.com/ModaresiBusiness/index/blob/main/index.html\" spellcheck=\"false\"><\/textarea>\n<div class=\"row\"><button id=\"go\">تبدیل کن<\/button><button class=\"alt\" id=\"clr\">پاک کردن<\/button><button class=\"alt\" id=\"cpall\">کپی همه<\/button><\/div>\n<\/div>\n<div class=\"card\" id=\"results\" hidden><\/div>\n<p class=\"note\">نکته: برای کار کردن آدرس، باید توی ریپو از Settings ← Pages سایت فعال باشه. اگه Pages روی پوشه‌ی docs تنظیم شده، «docs/» رو از آدرس حذف کن.<\/p>\n<\/main>\n<script>\nfunction conv(raw){\n  var s=raw.trim();\n  if(!s)return null;\n  if(!/^https?:\\/\\//i.test(s))s='https://'+s;\n  var u;\n  try{u=new URL(s)}catch(e){return {err:'آدرس معتبر نیست'}}\n  var h=u.hostname.toLowerCase().replace(/^www\\./,'');\n  if(h==='raw.githubusercontent.com'){\n    var r=u.pathname.split('/').filter(Boolean);\n    if(r.length<3)return {err:'آدرس raw ناقص است'};\n    r.splice(2,1); // remove branch\n    u=new URL('https://github.com/'+r[0]+'/'+r[1]+'/blob/x/'+r.slice(2).join('/'));\n    h='github.com';\n  }\n  if(/\\.github\\.io$/.test(h))return {out:s,same:true};\n  if(h!=='github.com')return {err:'این آدرس گیت‌هاب نیست'};\n  var p=u.pathname.split('/').filter(Boolean);\n  if(p.length<1)return {err:'نام کاربری پیدا نشد'};\n  var user=p[0],host=user.toLowerCase()+'.github.io';\n  if(p.length===1)return {out:'https://'+host+'/'};\n  var repo=p[1].replace(/\\.git$/,'');\n  var base=(repo.toLowerCase()===host)?'https://'+host+'/':'https://'+host+'/'+repo+'/';\n  var path='';\n  if(p.length>=4&&(p[2]==='blob'||p[2]==='tree'))path=p.slice(4).join('/');\n  if(/(^|\\/)index\\.html?$/i.test(path))path=path.replace(/index\\.html?$/i,'');\n  return {out:base+path};\n}\nfunction esc(t){return t.replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}\nvar last=[];\nfunction run(){\n  var lines=document.getElementById('in').value.split(/\\n+/).filter(function(l){return l.trim()});\n  var box=document.getElementById('results');\n  last=[];\n  if(!lines.length){box.hidden=true;return}\n  box.innerHTML='';\n  lines.forEach(function(l,i){\n    var r=conv(l),d=document.createElement('div');d.className='res';\n    var h='<div class=\"in\">'+esc(l.trim())+'<\/div>';\n    if(r.err){h+='<div class=\"err\">'+r.err+'<\/div>'}\n    else{last.push(r.out);\n      h+='<div class=\"out\">'+esc(r.out)+'<\/div>'+(r.same?'<span class=\"tag\">این از قبل آدرس سایت است<\/span>':'')+\n      '<div class=\"row\"><button data-c=\"'+i+'\">کپی<\/button><button class=\"alt\" data-o=\"'+i+'\">باز کردن<\/button><\/div>';}\n    d.innerHTML=h;d.dataset.out=r.out||'';box.appendChild(d);\n  });\n  box.hidden=false;\n}\ndocument.getElementById('go').onclick=run;\ndocument.getElementById('in').addEventListener('input',run);\ndocument.getElementById('clr').onclick=function(){document.getElementById('in').value='';run()};\nfunction copy(t,btn){\n  var done=function(){var o=btn.textContent;btn.textContent='کپی شد ✓';setTimeout(function(){btn.textContent=o},1200)};\n  try{navigator.clipboard.writeText(t).then(done,function(){fb(t);done()})}catch(e){fb(t);done()}\n}\nfunction fb(t){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}\ndocument.getElementById('cpall').onclick=function(){copy(last.join('\\n'),this)};\ndocument.getElementById('results').addEventListener('click',function(e){\n  var b=e.target.closest('button');if(!b)return;\n  var d=b.closest('.res').dataset.out;\n  if(b.dataset.c!==undefined)copy(d,b);\n  else if(b.dataset.o!==undefined)window.open(d,'_blank','noopener');\n});\n<\/script>\n<\/body>\n<\/html>\n", "phones": "<!DOCTYPE html>\n<html lang=\"fa\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>مرتب‌ساز لیست شماره‌ها<\/title>\n<style>\n:root{--bg:#f3f6f4;--card:#fff;--ink:#17261f;--mut:#5d6f66;--line:#d5dfd9;--acc:#1f6b4f;--accink:#fff}\n@media (prefers-color-scheme:dark){:root{--bg:#121a16;--card:#1a2520;--ink:#e6efe9;--mut:#93a69b;--line:#2c3b34;--acc:#4cc08f;--accink:#06140d}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,\"Vazirmatn\",system-ui,sans-serif;line-height:1.7;padding:18px}\nmain{max-width:860px;margin:0 auto;display:grid;gap:16px}\nh1{font-size:1.25rem;margin:0}\np.sub{margin:0;color:var(--mut);font-size:.9rem}\nsection{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}\nlabel{font-weight:700;display:block;margin-bottom:6px}\ntextarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:10px;font:inherit;resize:vertical}\n.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}\nbutton,select{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}\nbutton.main{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}\nbutton:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}\n#out{direction:rtl;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:60px;font-size:1rem}\n#cnt{color:var(--mut);font-size:.9rem}\n<\/style>\n<\/head>\n<body>\n<main>\n  <div>\n    <h1>مرتب‌ساز لیست شماره‌ها<\/h1>\n    <p class=\"sub\">پیام‌ها را اینجا بچسبانید. نام فرستنده و ساعت حذف می‌شود، شماره همیشه اول می‌آید و متن‌های جداافتاده به شماره‌ی قبلی وصل می‌شوند.<\/p>\n  <\/div>\n\n  <section>\n    <label for=\"inp\">پیام‌های کپی‌شده<\/label>\n    <textarea id=\"inp\" spellcheck=\"false\"><\/textarea>\n    <div class=\"row\">\n      <button class=\"main\" id=\"go\">مرتب کن<\/button>\n      <label for=\"fmt\" style=\"margin:0\">قالب خروجی<\/label>\n      <select id=\"fmt\">\n        <option value=\"dash\">شماره — نام<\/option>\n        <option value=\"tab\">شماره ⇥ نام (برای اکسل)<\/option>\n        <option value=\"num\">شماره‌دار: ۱. شماره — نام<\/option>\n        <option value=\"only\">فقط شماره‌ها<\/option>\n      <\/select>\n    <\/div>\n  <\/section>\n\n  <section>\n    <label for=\"out\">لیست مرتب‌شده <span id=\"cnt\"><\/span><\/label>\n    <div id=\"out\" tabindex=\"0\" aria-live=\"polite\"><\/div>\n    <div class=\"row\">\n      <button class=\"main\" id=\"copy\">کپی لیست<\/button>\n      <span id=\"msg\" role=\"status\"><\/span>\n    <\/div>\n  <\/section>\n<\/main>\n\n<script>\nconst $ = id => document.getElementById(id);\nconst fa = '۰۱۲۳۴۵۶۷۸۹', ar = '٠١٢٣٤٥٦٧٨٩';\nconst norm = s => s.replace(/[۰-۹]/g, d => fa.indexOf(d)).replace(/[٠-٩]/g, d => ar.indexOf(d));\nconst headerRe = /^.{1,80},\\s*\\[[^\\]]*\\d[^\\]]*\\]:?\\s*$/;\nconst phoneRe = /(?:\\+98|0098|0)?9\\d{9}/;\nconst phoneAll = new RegExp(phoneRe.source, 'g');\nlet current = '';\n\nfunction parse(raw){\n  const lines = norm(raw).replace(/\\r/g,'').split('\\n');\n  const msgs = [];\n  let cur = null, hasHeader = lines.some(l => headerRe.test(l.trim()));\n  for (const l of lines){\n    const t = l.trim();\n    if (hasHeader){\n      if (headerRe.test(t)){ cur = []; msgs.push(cur); continue; }\n      if (!cur){ cur = []; msgs.push(cur); }\n      if (t) cur.push(t);\n    } else {\n      if (!t){ cur = null; continue; }\n      if (!cur){ cur = []; msgs.push(cur); }\n      cur.push(t);\n    }\n  }\n  const entries = [];\n  for (const m of msgs){\n    if (!m.length) continue;\n    const text = m.join(' ');\n    const found = text.match(phoneAll);\n    if (found){\n      const name = text.replace(phoneAll, ' ').replace(/(^|\\s)[-–—،,\\/|:؛;]+(?=\\s|$)/g, ' ').replace(/\\s+/g,' ').trim();\n      const seen = new Set();\n      for (const raw of found){\n        let p = raw.replace(/^\\+98|^0098/, '0');\n        if (!p.startsWith('0')) p = '0' + p;\n        if (seen.has(p)) continue;\n        seen.add(p);\n        entries.push({phone:p, name});\n      }\n    } else if (entries.length){\n      const last = entries[entries.length-1];\n      last.name = (last.name + ' ' + text).trim();\n    } else {\n      entries.push({phone:'', name:text});\n    }\n  }\n  return entries;\n}\n\nfunction render(){\n  const list = parse($('inp').value);\n  const f = $('fmt').value;\n  const lines = list.map((e,i) => {\n    if (f === 'only') return e.phone;\n    if (f === 'tab') return e.phone + '\\t' + e.name;\n    const base = e.name ? e.phone + ' — ' + e.name : e.phone;\n    return f === 'num' ? (i+1) + '. ' + base : base;\n  });\n  current = lines.join('\\n');\n  $('out').textContent = current || 'چیزی پیدا نشد.';\n  $('cnt').textContent = list.length ? '(' + list.length + ' مورد)' : '';\n  $('msg').textContent = '';\n}\n\n$('go').onclick = render;\n$('fmt').onchange = render;\n$('inp').addEventListener('input', render);\n$('copy').onclick = async () => {\n  try { await navigator.clipboard.writeText(current); $('msg').textContent = 'کپی شد.'; }\n  catch(e){\n    const r = document.createRange(); r.selectNodeContents($('out'));\n    const s = getSelection(); s.removeAllRanges(); s.addRange(r);\n    $('msg').textContent = 'متن انتخاب شد؛ Ctrl+C بزنید.';\n  }\n};\nrender();\n<\/script>\n<\/body>\n<\/html>\n", "adwriter": "<!DOCTYPE html>\n<html lang=\"fa\" dir=\"rtl\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n<title>مُهر آگهی<\/title>\n<style>\n  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap');\n  :root {\n    --paper: #F1EFE6; --paper-2: #E9E5D6; --ink: #211D18; --ink-soft: #5B5648;\n    --forest: #2C5F46; --forest-dark: #1E4433; --stamp: #5B3A8E; --stamp-light: #ECE5F7; --line: #D8D3C4;\n  }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; background: var(--paper); }\n  body { font-family: 'Vazirmatn', sans-serif; color: var(--ink); }\n  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 18px 40px; }\n  .eyebrow { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: .12em; color: var(--stamp); text-transform: uppercase; margin-bottom: 6px; }\n  h1 { font-size: 26px; font-weight: 900; margin: 0 0 4px; color: var(--forest-dark); }\n  .subtitle { color: var(--ink-soft); font-size: 13.5px; margin-bottom: 22px; }\n  .steps-row { display: flex; justify-content: space-between; margin-bottom: 26px; position: relative; }\n  .steps-row::before { content: \"\"; position: absolute; top: 15px; right: 24px; left: 24px; height: 1px; background: var(--line); }\n  .step-dot { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }\n  .step-dot .circle { width: 30px; height: 30px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--line); display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 12px; color: var(--ink-soft); transition: all .25s; }\n  .step-dot.active .circle { border-color: var(--forest); color: var(--forest); background: #fff; }\n  .step-dot.done .circle { background: var(--forest); border-color: var(--forest); color: #fff; }\n  .step-dot .lbl { font-size: 10.5px; color: var(--ink-soft); }\n  .step-dot.active .lbl { color: var(--forest-dark); font-weight: 700; }\n  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; margin-bottom: 18px; }\n  label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 7px; color: var(--forest-dark); }\n  input[type=\"text\"], input[type=\"password\"], textarea, input[type=\"number\"] {\n    width: 100%; border: 1.5px solid var(--line); border-radius: 9px; padding: 11px 12px;\n    font-family: 'Vazirmatn', sans-serif; font-size: 14px; color: var(--ink); background: var(--paper);\n    outline: none; transition: border-color .2s;\n  }\n  input:focus, textarea:focus { border-color: var(--forest); }\n  textarea { resize: vertical; min-height: 90px; margin-bottom: 16px; }\n  input[type=\"text\"], input[type=\"password\"] { margin-bottom: 16px; }\n  .platform-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }\n  .plat-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 11px; cursor: pointer; background: var(--paper); transition: all .15s; text-align: right; }\n  .plat-card:hover { border-color: var(--forest); }\n  .plat-card.sel { border-color: var(--forest); background: #fff; box-shadow: 0 0 0 2px var(--forest) inset; }\n  .plat-card .emoji { font-size: 22px; }\n  .plat-card .title { font-weight: 700; font-size: 14.5px; }\n  .plat-card .sub { font-size: 12px; color: var(--ink-soft); }\n  .fw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }\n  .fw-card { border: 1.5px solid var(--line); border-radius: 11px; padding: 12px; cursor: pointer; background: var(--paper); transition: all .15s; }\n  .fw-card:hover { border-color: var(--stamp); }\n  .fw-card.sel { border-color: var(--stamp); background: var(--stamp-light); }\n  .fw-card .code { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 15px; color: var(--stamp); }\n  .fw-card .name { font-size: 12.5px; font-weight: 700; margin: 3px 0 4px; }\n  .fw-card .desc { font-size: 11px; color: var(--ink-soft); line-height: 1.5; }\n  .msg-note { background: var(--stamp-light); border: 1px dashed var(--stamp); border-radius: 10px; padding: 14px; font-size: 13px; color: var(--forest-dark); }\n  .btn-row { display: flex; gap: 10px; margin-top: 4px; }\n  button.nav { font-family: 'Vazirmatn', sans-serif; font-weight: 700; font-size: 14px; border: none; border-radius: 10px; padding: 12px 18px; cursor: pointer; transition: opacity .15s; }\n  button.nav:disabled { opacity: .4; cursor: not-allowed; }\n  .btn-primary { background: var(--forest); color: #fff; flex: 1; }\n  .btn-primary:hover:not(:disabled) { background: var(--forest-dark); }\n  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1.5px solid var(--line); }\n  .result-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 26px 20px; position: relative; overflow: hidden; }\n  .result-text { white-space: pre-wrap; line-height: 1.9; font-size: 14.5px; margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 16px; }\n  .result-head { display: flex; align-items: center; justify-content: space-between; }\n  .stamp-badge { color: var(--stamp); opacity: .9; animation: stampIn .5s ease-out; }\n  @keyframes stampIn { 0% { transform: scale(2) rotate(-15deg); opacity: 0; } 70% { transform: scale(.9) rotate(4deg); opacity: 1; } 100% { transform: scale(1) rotate(-6deg); opacity: 1; } }\n  .copy-btn { font-family: 'Space Mono', monospace; font-size: 12px; border: 1.5px solid var(--forest); color: var(--forest); background: #fff; border-radius: 8px; padding: 7px 12px; cursor: pointer; }\n  .copy-btn:hover { background: var(--forest); color: #fff; }\n  .err { color: #A23B2E; font-size: 13px; margin-top: 10px; }\n  .loading-line { font-size: 13px; color: var(--ink-soft); text-align: center; padding: 30px 0; }\n  .num-row { display: flex; align-items: center; gap: 10px; }\n  .num-row input { width: 90px; }\n  .key-note { font-size: 11.5px; color: var(--ink-soft); margin-top: -8px; margin-bottom: 16px; line-height: 1.7; }\n  .key-note a { color: var(--stamp); }\n  .settings-link { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--ink-soft); cursor: pointer; text-decoration: underline; float: left; margin-top: -30px; }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\" id=\"app\"><\/div>\n\n<script>\nconst FRAMEWORKS = [\n  { code: \"PAS\", name: \"مشکل - تشدید - راه‌حل\", desc: \"اول مشکل مخاطب رو نشون میده، بعد بزرگش می‌کنه، بعد محصول رو راه‌حل معرفی می‌کنه.\" },\n  { code: \"FAB\", name: \"ویژگی - مزیت - فایده\", desc: \"ویژگی فنی محصول رو میگه، مزیتش رو توضیح میده، به فایده‌ی نهایی برای مشتری وصل می‌کنه.\" },\n  { code: \"AIDA\", name: \"توجه - علاقه - تمایل - اقدام\", desc: \"با یه جمله‌ی جذاب توجه می‌گیره، علاقه می‌سازه، تمایل به خرید ایجاد می‌کنه، دعوت به اقدام می‌کنه.\" },\n  { code: \"PAPA\", name: \"مشکل - تشدید - اثبات - اقدام\", desc: \"شبیه PAS ولی به‌جای راه‌حل ساده، با اثبات و مدرک (نتیجه واقعی) اعتمادسازی می‌کنه.\" },\n  { code: \"4P\", name: \"تصویر - وعده - اثبات - سوق\", desc: \"یه تصویر ذهنی می‌سازه، وعده نتیجه میده، اثباتش می‌کنه، مخاطب رو به خرید سوق میده.\" },\n  { code: \"RAD\", name: \"نتیجه - مزیت - جزئیات\", desc: \"مستقیم می‌ره سراغ نتیجه‌ای که مشتری می‌گیره، مزیتش رو میگه و با جزئیات دقیق تکمیل می‌کنه.\" },\n  { code: \"SLAP\", name: \"توقف - نگاه - اقدام - خرید\", desc: \"مخاطب رو با یه قلاب متوقف می‌کنه، توجهش رو جلب می‌کنه، وادار به اقدام و خرید می‌کنه.\" },\n];\nconst PLATFORMS = [\n  { id: \"divar\", title: \"دیوار\", sub: \"آگهی نیازمندی با فرمول تبلیغ‌نویسی\", emoji: \"🏷️\" },\n  { id: \"instagram\", title: \"اینستاگرام\", sub: \"کپشن + ترغیب به کامنت + هشتگ\", emoji: \"📷\" },\n  { id: \"messenger\", title: \"پیام‌رسان‌ها\", sub: \"ایتا، روبیکا، تلگرام، بله\", emoji: \"💬\" },\n];\n\nlet state = {\n  step: 1,\n  productName: \"\", productDesc: \"\", platform: null, framework: null, divarMode: \"simple\",\n  igInstruction: \"\", hashtagCount: 15, copied: false\n};\n\nfunction render() {\n  const app = document.getElementById(\"app\");\n  app.innerHTML = mainScreenHTML();\n  attachMainScreen();\n}\n\nfunction stepLabels() { return [\"کالا\", \"پلتفرم\", \"تنظیمات\", \"خروجی\"]; }\n\nfunction stampBadgeSVG() {\n  return `<svg viewBox=\"0 0 120 120\" width=\"72\" height=\"72\">\n    <circle cx=\"60\" cy=\"60\" r=\"54\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" />\n    <circle cx=\"60\" cy=\"60\" r=\"46\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"2 4\" />\n    <text x=\"60\" y=\"56\" text-anchor=\"middle\" font-family=\"'Space Mono', monospace\" font-size=\"13\" font-weight=\"700\" fill=\"currentColor\">آماده<\/text>\n    <text x=\"60\" y=\"72\" text-anchor=\"middle\" font-family=\"'Vazirmatn', sans-serif\" font-size=\"9\" fill=\"currentColor\">تولید شد<\/text>\n  <\/svg>`;\n}\n\nfunction mainScreenHTML() {\n  const canContinue1 = state.productName.trim().length > 0 && state.productDesc.trim().length > 0;\n  const canContinue2 = !!state.platform;\n  const canGenerate =\n    state.platform === \"divar\" ? !!state.framework :\n    state.platform === \"instagram\" ? state.igInstruction.trim().length > 0 && state.hashtagCount > 0 :\n    state.platform === \"messenger\" ? true : false;\n\n  let stepsHTML = `<div class=\"steps-row\">` + stepLabels().map((lbl, i) => {\n    const n = i + 1;\n    const cls = n === state.step ? \"active\" : n < state.step ? \"done\" : \"\";\n    return `<div class=\"step-dot ${cls}\"><div class=\"circle\">${n < state.step ? \"✓\" : n}<\/div><div class=\"lbl\">${lbl}<\/div><\/div>`;\n  }).join(\"\") + `<\/div>`;\n\n  let body = \"\";\n\n  if (state.step === 1) {\n    body = `\n      <div class=\"card\">\n        <label>نام کالا<\/label>\n        <input type=\"text\" id=\"productName\" value=\"${escapeAttr(state.productName)}\" placeholder=\"مثلاً: اسپری نانو ضدلک شیشه گ‌پلاس\" />\n        <label>توضیحات کالا<\/label>\n        <textarea id=\"productDesc\" placeholder=\"ویژگی‌ها، حجم، کاربرد، مزیت نسبت به مشابه‌ها...\">${escapeHTML(state.productDesc)}<\/textarea>\n        <div class=\"btn-row\">\n          <button class=\"nav btn-primary\" id=\"toStep2\" ${canContinue1 ? \"\" : \"disabled\"}>ادامه<\/button>\n        <\/div>\n      <\/div>`;\n  } else if (state.step === 2) {\n    body = `\n      <div class=\"card\">\n        <label>پلتفرم مقصد<\/label>\n        <div class=\"platform-grid\">\n          ${PLATFORMS.map(p => `\n            <div class=\"plat-card ${state.platform === p.id ? \"sel\" : \"\"}\" data-plat=\"${p.id}\">\n              <span class=\"emoji\">${p.emoji}<\/span>\n              <div><div class=\"title\">${p.title}<\/div><div class=\"sub\">${p.sub}<\/div><\/div>\n            <\/div>`).join(\"\")}\n        <\/div>\n        <div class=\"btn-row\" style=\"margin-top:16px;\">\n          <button class=\"nav btn-ghost\" id=\"toStep1\">بازگشت<\/button>\n          <button class=\"nav btn-primary\" id=\"toStep3\" ${canContinue2 ? \"\" : \"disabled\"}>ادامه<\/button>\n        <\/div>\n      <\/div>`;\n  } else if (state.step === 3 && state.platform === \"divar\") {\n    const canGenPro = true;\n    body = `\n      <div class=\"card\">\n        <label>حالت آگهی‌نویسی<\/label>\n        <div class=\"btn-row\" style=\"margin-bottom:18px;\">\n          <button class=\"nav ${state.divarMode === \"simple\" ? \"btn-primary\" : \"btn-ghost\"}\" id=\"modeSimple\" style=\"flex:1;\">استاندارد (یک فرمول)<\/button>\n          <button class=\"nav ${state.divarMode === \"pro\" ? \"btn-primary\" : \"btn-ghost\"}\" id=\"modePro\" style=\"flex:1;\">ژنرال دیوار — حرفه‌ای 🎖️<\/button>\n        <\/div>\n        ${state.divarMode === \"simple\" ? `\n          <label>فرمول تبلیغ‌نویسی<\/label>\n          <div class=\"fw-grid\">\n            ${FRAMEWORKS.map(f => `\n              <div class=\"fw-card ${state.framework === f.code ? \"sel\" : \"\"}\" data-fw=\"${f.code}\">\n                <div class=\"code\">${f.code}<\/div><div class=\"name\">${f.name}<\/div><div class=\"desc\">${f.desc}<\/div>\n              <\/div>`).join(\"\")}\n          <\/div>\n        ` : `\n          <div class=\"msg-note\">\n            این حالت یه پرامپت کامل و حرفه‌ای می‌سازه که هوش مصنوعی رو مثل یه استراتژیست رشد دیوار به کار می‌گیره: تحلیل ۱۰ آگهی رقیب، تولید ۳۰ عنوان و امتیازدهی، نوشتن آگهی با هر ۷ فرمول و انتخاب برنده، نقد از دید یه مشتری بدبین، پیشنهاد عکس و قیمت، و بررسی قوانین دیوار.\n            <br/><br/>\n            چون این حالت جزئیات بیشتری (شهر، قیمت، مزیت نسبت به رقبا و...) لازم داره، وقتی پرامپت رو به هوش مصنوعی دادی، اگه چیزی کم بود خودش ازت می‌پرسه.\n          <\/div>\n        `}\n        <div class=\"btn-row\" style=\"margin-top:16px;\">\n          <button class=\"nav btn-ghost\" id=\"backTo2\">بازگشت<\/button>\n          <button class=\"nav btn-primary\" id=\"genBtn\" ${(state.divarMode === \"pro\" ? canGenPro : canGenerate) ? \"\" : \"disabled\"}>ساخت پرامپت<\/button>\n        <\/div>\n      <\/div>`;\n  } else if (state.step === 3 && state.platform === \"instagram\") {\n    body = `\n      <div class=\"card\">\n        <label>مشتری چیکار کنه؟ (مثلاً: عدد ۱ رو کامنت کنید تا لینک خرید براتون دایرکت بشه)<\/label>\n        <textarea id=\"igInstruction\" placeholder=\"توضیح بده مشتری چی باید کامنت بذاره و چی می‌گیره...\">${escapeHTML(state.igInstruction)}<\/textarea>\n        <label>تعداد هشتگ<\/label>\n        <div class=\"num-row\" style=\"margin-bottom:16px;\">\n          <input type=\"number\" id=\"hashtagCount\" min=\"1\" max=\"30\" value=\"${state.hashtagCount}\" />\n        <\/div>\n        <div class=\"btn-row\">\n          <button class=\"nav btn-ghost\" id=\"backTo2\">بازگشت<\/button>\n          <button class=\"nav btn-primary\" id=\"genBtn\" ${canGenerate ? \"\" : \"disabled\"}>ساخت پرامپت<\/button>\n        <\/div>\n      <\/div>`;\n  } else if (state.step === 3 && state.platform === \"messenger\") {\n    body = `\n      <div class=\"card\">\n        <div class=\"msg-note\">یک پرامپت آماده برای متن تبلیغاتی ایتا، روبیکا، تلگرام و بله بر اساس نام و توضیحات کالا می‌سازم.<\/div>\n        <div class=\"btn-row\" style=\"margin-top:16px;\">\n          <button class=\"nav btn-ghost\" id=\"backTo2\">بازگشت<\/button>\n          <button class=\"nav btn-primary\" id=\"genBtn\">ساخت پرامپت<\/button>\n        <\/div>\n      <\/div>`;\n  } else if (state.step === 4) {\n    body = `\n      <div class=\"result-card\">\n        <div class=\"result-head\">\n          <div class=\"stamp-badge\">${stampBadgeSVG()}<\/div>\n          <button class=\"copy-btn\" id=\"copyBtn\">${state.copied ? \"کپی شد ✓\" : \"کپی پرامپت\"}<\/button>\n        <\/div>\n        <div class=\"msg-note\" style=\"margin-top:14px;\">پرامپت خودکار کپی شد ✓ — دکمه‌ی ChatGPT پرامپت رو از قبل براش می‌بره. برای claude.ai کافیه بعد از باز شدن، Ctrl+V بزنی.<\/div>\n        <div class=\"btn-row\" style=\"margin-top:12px;\">\n          <button class=\"nav btn-primary\" id=\"openChatGPT\" style=\"flex:1;\">باز کردن مستقیم در ChatGPT<\/button>\n          <button class=\"nav btn-ghost\" id=\"openClaude\">باز کردن claude.ai<\/button>\n        <\/div>\n        <div class=\"result-text\">${escapeHTML(state.result)}<\/div>\n        <div class=\"btn-row\" style=\"margin-top:18px;\">\n          <button class=\"nav btn-ghost\" id=\"editSettings\">ویرایش تنظیمات<\/button>\n          <button class=\"nav btn-ghost\" id=\"changePlatform\">تغییر پلتفرم<\/button>\n          <button class=\"nav btn-primary\" id=\"resetAll\">کالای جدید<\/button>\n        <\/div>\n      <\/div>`;\n  }\n\n  return `\n    <div class=\"eyebrow\">دستیار تبلیغ‌نویسی G+<\/div>\n    <h1>مُهر آگهی<\/h1>\n    <div class=\"subtitle\">اسم و توضیح کالا رو بده، پلتفرم رو انتخاب کن، پرامپت آماده بگیر و به هوش مصنوعی بده.<\/div>\n    ${stepsHTML}\n    ${body}\n  `;\n}\n\nfunction escapeHTML(s) {\n  return (s || \"\").replace(/&/g,\"&amp;\").replace(/<\/g,\"&lt;\").replace(/>/g,\"&gt;\");\n}\nfunction escapeAttr(s) { return escapeHTML(s).replace(/\"/g,\"&quot;\"); }\n\nfunction buildPrompt() {\n  if (state.platform === \"divar\" && state.divarMode === \"pro\") {\n    return `تو یک استراتژیست ارشد رشد در دیوار، تحلیلگر رفتار خریدار محلی، کپی‌رایتر مستقیم (Direct Response) و متخصص افزایش تماس و تبدیل هستی.\n\nهدف تو فقط نوشتن متن نیست.\n\nهدف تو:\n- گرفتن بیشترین کلیک در یک شهر مشخص\n- گرفتن بیشترین تماس واقعی\n- شکست دادن رقبا در همان شهر و همان دسته\n- افزایش نرخ تبدیل آگهی به مشتری\n\nاطلاعات اولیه‌ای که از من داری:\nنام کالا: ${state.productName}\nتوضیحات کالا: ${state.productDesc}\n\n---\nمرحله ۱: جمع‌آوری اطلاعات\n\nاگر اطلاعات زیر رو از توضیحات بالا نمی‌تونی دربیاری، اول ازم بپرس و ادامه نده:\n۱. محصول یا خدمت چیست؟ (از بالا دارم)\n۲. شهر دقیق (اجباری)\n۳. محدوده‌های سرویس‌دهی داخل شهر (در صورت خدمات)\n۴. محصول نو است یا کارکرده؟\n۵. قیمت یا بازه قیمت\n۶. مشتری دقیق چه کسی است؟\n۷. مشکل اصلی مشتری چیست؟\n۸. نتیجه نهایی برای مشتری چیست؟\n۹. ۳ مزیت واقعی و قابل اثبات نسبت به رقبا چیست؟\n۱۰. خدمات/ویژگی‌های اصلی چیست؟\n۱۱. آیا ضمانت، تست یا نمونه کار داری؟\n۱۲. هدف آگهی چیست؟ (تماس / پیام / خرید / مراجعه)\n\n---\nمرحله ۲: تحلیل بازار محلی (حیاتی)\n\nفقط بازار همان شهر + همان دسته دیوار را تحلیل کن.\nورودی تحلیل: ۱۰ آگهی اول رقبا در همان شهر، همان دسته‌بندی، همان کلمات کلیدی.\n\nتحلیل کن:\n- همه رقبا چه چیزهایی می‌گویند؟ (الگوهای تکراری)\n- چه وعده‌هایی بیش از حد کلیشه‌ای شده؟\n- چه چیزی باعث می‌شود همه شبیه هم به نظر برسند؟\n- چه چیزی در بازار گفته نشده؟ (شکاف پیام)\n- مشتری در این شهر بیشتر روی چه چیزی حساس است؟ (قیمت / سرعت / اعتماد / کیفیت)\n\nدر پایان: ۳ فرصت برای «تمایز واقعی» استخراج کن.\n\n---\nمرحله ۳: ساخت عنوان\n\n۳۰ عنوان تولید کن. شرایط: مخصوص دیوار، کمتر از ۵۰ کاراکتر، کاملاً محلی و قابل فهم برای همان شهر، بدون اغراق، بدون کلیشه، نتیجه‌محور یا مسئله‌محور، ایجاد کنجکاوی واقعی.\nبرای هر عنوان امتیاز جذابیت از ۱۰ بده.\n\n---\nمرحله ۴: انتخاب عنوان برنده\n\n۳ عنوان برتر را جدا کن، سپس ۱ عنوان نهایی را انتخاب کن و دلیل انتخاب را بر اساس رفتار کاربر دیوار توضیح بده.\n\n---\nمرحله ۵: تولید آگهی\n\nبرای همان محصول/خدمت با هر ۷ فرمول زیر بنویس: PAS, FAB, AIDA, PAPA, 4P, RAD, SLAP\nقوانین: کوتاه، واقعی، محلی، مخصوص کاربر دیوار (نه مقاله، نه تبلیغ اینستاگرامی)، بدون اغراق و وعده غیرواقعی، دارای CTA واضح.\n\n---\nمرحله ۶: انتخاب نسخه برتر\n\nتمام مدل‌ها را مقایسه کن. فقط ۱ نسخه را انتخاب کن که بیشترین احتمال تماس دارد. آن را بازنویسی کن تا نسخه اولیه نهایی ساخته شود.\n\n---\nمرحله ۷: ارزیابی دوگانه (کلیدی‌ترین مرحله)\n\nنقش ۱ — تحلیلگر فروش: نسخه اولیه را از ۱۰ امتیاز بده برای: قدرت عنوان، نرخ کلیک (CTR)، اعتمادسازی، وضوح پیام، قدرت متقاعدسازی، احتمال تماس، احتمال فروش، تناسب با بازار شهر. اگر امتیاز زیر ۹ بود، اصلاح کن.\n\nنقش ۲ — مشتری بدبین محلی: نقش یک مشتری واقعی همان شهر را بازی کن که تجربه بد از خدمات مشابه داشته، به آگهی‌ها اعتماد کمی دارد، قیمت و زمان برایش مهم است. آگهی را نقد کن: چرا روی این آگهی کلیک نمی‌کنم؟ چرا تماس نمی‌گیرم؟ چه چیزی مشکوک یا کلیشه‌ای است؟ چه چیزی کم است که در آگهی رقبا هست ولی اینجا نیست؟ ۳ تغییر حیاتی برای افزایش تماس چیست؟\nسپس آگهی را اصلاح کن و نسخه نهایی را بساز.\n\n---\nمرحله ۸: پیشنهاد تصویر\n\n۱۰ ایده عکس مخصوص همان محصول + همان شهر بده. سپس بهترین عکس را انتخاب کن و دلیل انتخاب را بگو.\n\n---\nمرحله ۹: قیمت‌گذاری\n\nاگر قیمت اثر دارد: بهترین قیمت پیشنهادی برای همان بازار شهر را بده و توضیح بده چرا در این شهر این قیمت بهتر جواب می‌دهد.\n\n---\nمرحله ۱۰: بررسی قوانین دیوار\n\nبررسی کن: کلمات حساس، وعده‌های خطرناک، ادعاهای غیرقابل اثبات. نسخه اصلاح‌شده ارائه بده.\n\n---\nمرحله ۱۱: افزایش فروش\n\n۱۰ پیشنهاد عملی برای افزایش تماس: زمان انتشار در همان شهر، استراتژی نردبان، اصلاح عنوان، عکس بهتر، ترتیب متن، افزایش اعتماد، کاهش تردید مشتری، پاسخ‌گویی سریع، تفاوت‌سازی با رقبا، بهبود نرخ تبدیل تماس.\n\n---\nقوانین اصلی: هیچ چیز حدسی نیست. همه چیز باید واقعی و قابل اجرا باشد. تمرکز فقط روی شهر هدف است. هدف فقط تولید متن نیست؛ هدف شکست دادن رقبا در همان بازار محلی است.`;\n  }\n  if (state.platform === \"divar\") {\n    const fw = FRAMEWORKS.find(f => f.code === state.framework);\n    return `تو یک کپی‌رایتر حرفه‌ای فارسی هستی که برای پلتفرم آگهی نیازمندی‌های «دیوار» آگهی می‌نویسی.\nنام کالا: ${state.productName}\nتوضیحات کالا: ${state.productDesc}\n\nآگهی رو دقیقاً با ساختار فرمول «${fw.code}» (${fw.name}) بنویس.\nتوضیح فرمول: ${fw.desc}\n\nقوانین:\n- کاملاً فارسی و طبیعی بنویس، از شعار اغراق‌آمیز و ادعای غیرواقعی پرهیز کن.\n- طول متن مناسب یک آگهی دیوار باشه.\n- در پایان یک خط برای دعوت به تماس/پیام بذار.\n- فقط متن نهایی آگهی رو بده، بدون توضیح اضافه یا عنوان فرمول.`;\n  }\n  if (state.platform === \"instagram\") {\n    return `تو یک کپی‌رایتر حرفه‌ای فارسی برای کپشن اینستاگرام هستی.\nنام کالا: ${state.productName}\nتوضیحات کالا: ${state.productDesc}\n\nیک کپشن اینستاگرام فارسی بنویس که:\n۱) محصول رو با لحن جذاب و صمیمی معرفی کنه.\n۲) مخاطب رو دقیقاً بر اساس این دستور ترغیب به کامنت‌گذاری کنه: «${state.igInstruction}»\n۳) در انتها دقیقاً ${state.hashtagCount} هشتگ فارسی و انگلیسی مرتبط و دقیق با این محصول بده.\n\nفقط متن نهایی کپشن رو بده، بدون توضیح اضافه.`;\n  }\n  return `تو یک کپی‌رایتر حرفه‌ای فارسی برای پیام‌رسان‌های ایتا، روبیکا، تلگرام و بله هستی.\nنام کالا: ${state.productName}\nتوضیحات کالا: ${state.productDesc}\n\nیک متن تبلیغاتی کوتاه و جذاب فارسی بنویس، با لحن صمیمی و حرفه‌ای، مناسب ارسال در کانال یا گروه، شامل معرفی محصول. از ایموجی مناسب و کم استفاده کن.\n\nبعد از تمام شدن متن تبلیغاتی، این بلوک رو دقیقاً و بدون هیچ تغییری (نه کلمه‌ای کم یا زیاد، نه بازنویسی) عیناً در انتها اضافه کن:\n\n📩 همین الان سفارش بده!\n📍فعال در یزد\n🚛📦ارسال به کل نقاط کشور 📦🚛\n📌 ثبت سفارش\n@EZGAMETV\n\nفقط متن نهایی (تبلیغ + این بلوک ثابت) رو بده، بدون توضیح اضافه.`;\n}\n\nfunction handleGenerate() {\n  state.result = buildPrompt();\n  state.step = 4;\n  state.copied = true;\n  render();\n  navigator.clipboard.writeText(state.result).catch(() => {});\n}\n\nfunction attachMainScreen() {\n  if (state.step === 1) {\n    const updateStep1Btn = () => {\n      const ok = state.productName.trim().length > 0 && state.productDesc.trim().length > 0;\n      document.getElementById(\"toStep2\").disabled = !ok;\n    };\n    document.getElementById(\"productName\").oninput = e => { state.productName = e.target.value; updateStep1Btn(); };\n    document.getElementById(\"productDesc\").oninput = e => { state.productDesc = e.target.value; updateStep1Btn(); };\n    document.getElementById(\"toStep2\").onclick = () => { state.step = 2; render(); };\n  }\n  if (state.step === 2) {\n    document.querySelectorAll(\".plat-card\").forEach(el => {\n      el.onclick = () => { state.platform = el.dataset.plat; render(); };\n    });\n    document.getElementById(\"toStep1\").onclick = () => { state.step = 1; render(); };\n    const btn3 = document.getElementById(\"toStep3\");\n    if (btn3) btn3.onclick = () => { state.step = 3; render(); };\n  }\n  if (state.step === 3) {\n    const back = document.getElementById(\"backTo2\");\n    if (back) back.onclick = () => { state.step = 2; state.error = \"\"; render(); };\n    const gen = document.getElementById(\"genBtn\");\n    if (gen) gen.onclick = handleGenerate;\n    if (state.platform === \"divar\") {\n      const modeSimple = document.getElementById(\"modeSimple\");\n      const modePro = document.getElementById(\"modePro\");\n      if (modeSimple) modeSimple.onclick = () => { state.divarMode = \"simple\"; render(); };\n      if (modePro) modePro.onclick = () => { state.divarMode = \"pro\"; render(); };\n      document.querySelectorAll(\".fw-card\").forEach(el => {\n        el.onclick = () => { state.framework = el.dataset.fw; render(); };\n      });\n    }\n    if (state.platform === \"instagram\") {\n      const updateGenBtn = () => {\n        const ok = state.igInstruction.trim().length > 0 && state.hashtagCount > 0;\n        const btn = document.getElementById(\"genBtn\");\n        if (btn) btn.disabled = !ok;\n      };\n      document.getElementById(\"igInstruction\").oninput = e => { state.igInstruction = e.target.value; updateGenBtn(); };\n      document.getElementById(\"hashtagCount\").oninput = e => { state.hashtagCount = Number(e.target.value); updateGenBtn(); };\n    }\n  }\n  if (state.step === 4) {\n    document.getElementById(\"copyBtn\").onclick = () => {\n      navigator.clipboard.writeText(state.result).then(() => {\n        state.copied = true; render();\n        setTimeout(() => { state.copied = false; render(); }, 1800);\n      });\n    };\n    document.getElementById(\"openChatGPT\").onclick = () => {\n      const url = \"https://chatgpt.com/?q=\" + encodeURIComponent(state.result);\n      window.open(url, \"_blank\");\n    };\n    document.getElementById(\"openClaude\").onclick = () => {\n      window.open(\"https://claude.ai/new\", \"_blank\");\n    };\n    document.getElementById(\"editSettings\").onclick = () => { state.step = 3; state.copied = false; render(); };\n    document.getElementById(\"changePlatform\").onclick = () => {\n      state.step = 2; state.copied = false; state.result = \"\";\n      state.platform = null; state.framework = null; state.divarMode = \"simple\"; state.igInstruction = \"\"; state.hashtagCount = 15;\n      render();\n    };\n    document.getElementById(\"resetAll\").onclick = () => {\n      state.step = 1; state.productName = \"\"; state.productDesc = \"\"; state.platform = null;\n      state.framework = null; state.divarMode = \"simple\"; state.igInstruction = \"\"; state.hashtagCount = 15; state.result = \"\"; state.copied = false;\n      render();\n    };\n  }\n}\n\nrender();\n<\/script>\n<\/body>\n<\/html>\n", "campaign": "<!DOCTYPE html>\n<html lang=\"fa\" dir=\"rtl\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>تولید پست‌های کمپین با ChatGPT<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --bg:#F4F9FD;\n    --bg-panel:#FFFFFF;\n    --bg-panel-2:#EAF3FC;\n    --text:#173049;\n    --text-dim:#5B7A93;\n    --gold:#2E6FED;\n    --gold-light:#4C8DFF;\n    --urgent:#D64545;\n    --urgent-light:#E67367;\n    --line:rgba(23,48,73,0.14);\n    --on-accent:#FFFFFF;\n    --radius:14px;\n  }\n  *{box-sizing:border-box; margin:0; padding:0;}\n  body{\n    background:var(--bg); color:var(--text);\n    font-family:'Vazirmatn', sans-serif; line-height:1.9;\n    padding:36px 18px 60px;\n  }\n  .wrap{max-width:760px; margin:0 auto;}\n  .head{margin-bottom:32px;}\n  .eyebrow{\n    display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600;\n    letter-spacing:.5px; color:var(--gold-light); text-transform:uppercase; margin-bottom:12px;\n  }\n  .eyebrow::before{content:''; width:20px; height:1px; background:var(--gold);}\n  h1{font-size:clamp(22px,3.4vw,30px); font-weight:800; margin-bottom:8px;}\n  .head p{color:var(--text-dim); font-size:14.5px;}\n\n  .panel{\n    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius);\n    padding:26px; margin-bottom:22px; box-shadow:0 4px 22px rgba(23,48,73,0.06);\n  }\n  .panel h3{font-size:15px; margin-bottom:16px; display:flex; align-items:center; gap:8px;}\n  .step-badge{\n    width:24px; height:24px; border-radius:50%; background:var(--gold); color:var(--on-accent);\n    font-size:12.5px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;\n  }\n\n  /* day cards */\n  .day-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}\n  .day-card{\n    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px;\n    padding:12px 8px; text-align:center; cursor:pointer; transition:.2s ease; font-size:13px;\n  }\n  .day-card:hover{border-color:var(--gold);}\n  .day-card.sel{background:rgba(46,111,237,0.14); border-color:var(--gold); color:var(--gold-light); font-weight:700;}\n  .day-card small{display:block; color:var(--text-dim); font-size:10.5px; margin-top:3px;}\n  .day-card.sel small{color:var(--gold-light);}\n\n  .tech-preview{\n    margin-top:16px; display:flex; flex-wrap:wrap; gap:8px; min-height:20px;\n  }\n  .chip{\n    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:100px;\n    padding:6px 13px; font-size:12.5px; color:var(--text-dim); cursor:pointer; user-select:none;\n    transition:.15s ease;\n  }\n  .chip:hover{border-color:var(--gold);}\n  .chip.sel{background:rgba(46,111,237,0.14); border-color:var(--gold); color:var(--gold-light); font-weight:700;}\n  .chip.sel::before{content:'✓ ';}\n\n  /* count */\n  .count-row{display:flex; align-items:center; gap:16px;}\n  input[type=range]{\n    flex:1; accent-color:var(--gold); height:4px;\n  }\n  .count-box{\n    min-width:56px; text-align:center; background:var(--bg-panel-2); border:1px solid var(--line);\n    border-radius:10px; padding:8px 6px; font-weight:800; color:var(--gold-light); font-size:17px;\n  }\n\n  textarea, select, input[type=text]{\n    width:100%; background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px;\n    color:var(--text); font-family:inherit; font-size:14px; padding:13px 14px; resize:vertical;\n  }\n  textarea:focus, select:focus, input:focus{outline:none; border-color:var(--gold);}\n  textarea::placeholder{color:#9FB4C7;}\n  label.field-label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:8px;}\n\n  .platform-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}\n\n  .btn{\n    display:inline-flex; align-items:center; justify-content:center; gap:10px; width:100%;\n    padding:16px 20px; border-radius:100px; font-weight:700; font-size:15px; border:none; cursor:pointer;\n    transition:transform .2s ease, box-shadow .2s ease;\n  }\n  .btn:hover{transform:translateY(-2px);}\n  .btn-primary{background:var(--gold); color:var(--on-accent); box-shadow:0 10px 26px -10px rgba(46,111,237,0.55);}\n  .btn-ghost{background:var(--bg-panel-2); color:var(--text); border:1px solid var(--line);}\n\n  .actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}\n\n  #promptPreview{\n    display:none; margin-top:18px;\n  }\n  #promptPreview.show{display:block;}\n  #promptOut{\n    min-height:220px; font-size:13px; color:var(--text-dim); line-height:1.85;\n    white-space:pre-wrap;\n  }\n  .copied-msg{\n    font-size:12.5px; color:var(--gold-light); margin-top:8px; opacity:0; transition:opacity .3s ease;\n  }\n  .copied-msg.show{opacity:1;}\n\n  @media(max-width:560px){\n    .day-grid{grid-template-columns:repeat(2,1fr);}\n    .platform-row{grid-template-columns:repeat(2,1fr);}\n    #outputTypeRow{grid-template-columns:repeat(1,1fr) !important;}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n  <div class=\"head\">\n    <div class=\"eyebrow\">ابزار تولید محتوای کمپین<\/div>\n    <h1>پست‌های هر روز کمپین رو با ChatGPT بساز<\/h1>\n    <p>یک روز از کمپین رو انتخاب کن، تعداد پست و توضیحات تکمیلی رو بده؛ پرامپتی متناسب با تکنیک‌های همون روز ساخته می‌شه و مستقیم به ChatGPT فرستاده می‌شه.<\/p>\n  <\/div>\n\n  <\!-- STEP 1: CAMPAIGN TYPE -->\n  <div class=\"panel\">\n    <h3><span class=\"step-badge\">۱<\/span> نوع کمپین<\/h3>\n    <div class=\"day-grid\" id=\"campaignTypeRow\" style=\"grid-template-columns:repeat(2,1fr);\"><\/div>\n  <\/div>\n\n  <\!-- STEP 2: DESCRIPTION -->\n  <div class=\"panel\">\n    <h3><span class=\"step-badge\">۲<\/span> توضیحات تکمیلی<\/h3>\n    <label class=\"field-label\">هر اطلاعاتی که به پست بهتر کمک می‌کنه — نام دوره یا فروشگاه، نام مدرس یا برند، مخاطب هدف، لحن نوشتار، نکات خاص همون روز و ...<\/label>\n    <textarea id=\"descBox\" rows=\"5\" placeholder=\"مثال: نام دوره «مسیر فروش»، مدرس [نام مدرس]، مخاطب‌ها اکثراً صاحبان کسب‌وکار کوچیک هستن، لحن صمیمی و مستقیم، حتماً یک سوال تعاملی در پایان هر پست باشه.\"><\/textarea>\n  <\/div>\n\n  <\!-- STEP 3: DAY -->\n  <div class=\"panel\">\n    <h3><span class=\"step-badge\">۳<\/span> انتخاب روز کمپین<\/h3>\n    <div class=\"day-grid\" id=\"dayGrid\"><\/div>\n    <label class=\"field-label\" style=\"margin-top:14px;\">تکنیک‌های همون روز — روی هرکدوم که نمی‌خوای استفاده بشه بزن تا از حالت انتخاب خارج بشه<\/label>\n    <div class=\"tech-preview\" id=\"techPreview\"><\/div>\n\n    <label style=\"display:flex; align-items:center; gap:10px; margin-top:18px; cursor:pointer; font-size:13.5px; color:var(--text);\">\n      <input type=\"checkbox\" id=\"ctaToggle\" style=\"width:18px; height:18px; accent-color:var(--gold); cursor:pointer; flex-shrink:0;\">\n      در پست آخر یک دعوت به اقدام (CTA) واضح و متناسب با پلتفرم بذار\n    <\/label>\n\n    <label style=\"display:flex; align-items:center; gap:10px; margin-top:14px; cursor:pointer; font-size:13.5px; color:var(--text);\">\n      <input type=\"checkbox\" id=\"curiosityToggle\" style=\"width:18px; height:18px; accent-color:var(--gold); cursor:pointer; flex-shrink:0;\">\n      آخرین پیام هر روز حس کنجکاوی ایجاد کنه تا مخاطب فردا هم برگرده و ادامه رو دنبال کنه\n    <\/label>\n\n    <label style=\"display:flex; align-items:center; gap:10px; margin-top:14px; cursor:pointer; font-size:13.5px; color:var(--text);\">\n      <input type=\"checkbox\" id=\"voiceVideoSuggestToggle\" style=\"width:18px; height:18px; accent-color:var(--gold); cursor:pointer; flex-shrink:0;\">\n      مخاطب رو به گوش دادن ویس یا دیدن ویدیوی همون روز هم دعوت کن (استوری/دایرکت)\n    <\/label>\n  <\/div>\n\n  <\!-- STEP 4: COUNT -->\n  <div class=\"panel\">\n    <h3><span class=\"step-badge\">۴<\/span> تعداد خروجی (پست یا استوری)<\/h3>\n    <div class=\"count-row\">\n      <input type=\"range\" id=\"countRange\" min=\"1\" max=\"20\" value=\"5\">\n      <div class=\"count-box\" id=\"countBox\">۵<\/div>\n    <\/div>\n  <\/div>\n\n  <\!-- STEP 5: PLATFORM -->\n  <div class=\"panel\">\n    <h3><span class=\"step-badge\">۵<\/span> پلتفرم انتشار<\/h3>\n    <div class=\"platform-row\" id=\"platformRow\"><\/div>\n  <\/div>\n\n  <\!-- STEP 6: OUTPUT TYPE -->\n  <div class=\"panel\">\n    <h3><span class=\"step-badge\">۶<\/span> نوع خروجی<\/h3>\n    <div class=\"day-grid\" id=\"outputTypeRow\" style=\"grid-template-columns:repeat(2,1fr);\"><\/div>\n\n    <div id=\"storyBox\" style=\"display:none; margin-top:18px;\">\n      <div id=\"basalamWarning\" style=\"display:none; background:rgba(214,69,69,0.09); border:1px solid rgba(214,69,69,0.35); border-radius:10px; padding:12px 14px; margin-bottom:14px; font-size:13px; color:var(--urgent); line-height:1.9;\">\n        ⚠️ چون پلتفرم انتخابی «باسلام» است، طبق قوانین باسلام هیچ شماره تماس یا آیدی شبکه‌های اجتماعی در استوری قرار نمی‌گیرد. استوری فقط شامل عکس محصول داخل یک کادر بسیار زیبا خواهد بود.\n      <\/div>\n      <label class=\"field-label\" id=\"storyImgLabel\">عکس محصول یا دوره (اختیاری) — اگه نداری خالی بذار، ChatGPT بدون عکس هم برات طرح استوری می‌سازه<\/label>\n      <input type=\"file\" id=\"imgInput\" accept=\"image/*\" style=\"width:100%; background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px; color:var(--text); padding:12px 14px; font-family:inherit; font-size:13.5px;\">\n      <div id=\"imgPreviewWrap\" style=\"display:none; margin-top:12px; align-items:center; gap:12px;\">\n        <img id=\"imgPreview\" style=\"width:64px; height:64px; object-fit:cover; border-radius:10px; border:1px solid var(--line);\">\n        <div style=\"font-size:12.5px; color:var(--text-dim);\">این عکس فقط برای پیش‌نمایش خودته. چون از طریق لینک نمی‌شه فایل به ChatGPT فرستاد، بعد از باز شدن ChatGPT همین عکس رو دستی با دکمه 📎 ضمیمه کن.<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n\n  <\!-- STEP 7: TONE -->\n  <div class=\"panel\">\n    <h3><span class=\"step-badge\">۷<\/span> لحن نوشتار<\/h3>\n    <div class=\"day-grid\" id=\"toneRow\" style=\"grid-template-columns:repeat(2,1fr);\">\n      <div class=\"day-card sel\" data-tone=\"friendly\">دوستانه و صمیمی<small>محاوره‌ای، گرم و طبیعی<\/small><\/div>\n      <div class=\"day-card\" data-tone=\"formal\">رسمی و حرفه‌ای<small>مرتب، جدی و قابل اعتماد<\/small><\/div>\n    <\/div>\n  <\/div>\n\n  <\!-- STEP 8: GENERATE -->\n  <\!-- STEP 8: GENERATE -->\n  <div class=\"panel\">\n    <h3><span class=\"step-badge\">۷<\/span> ساخت و ارسال<\/h3>\n    <button class=\"btn btn-primary\" id=\"buildBtn\">ساخت پرامپت<\/button>\n\n    <div id=\"promptPreview\">\n      <label
